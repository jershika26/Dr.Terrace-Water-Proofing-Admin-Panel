    <script>
        $(document).ready(function() {
            $('#datatable-employees').DataTable({
                "pageLength": 10,
                "language": {
                    "paginate": {
                        "previous": "<i class='mdi mdi-chevron-left'>",
                        "next": "<i class='mdi mdi-chevron-right'>"
                    }
                }
            });

            // View Employee Details Modal Handler
            $(document).on('click', '.btn-view-employee', function(e) {
                e.preventDefault();
                const btn = $(this);
                $('#modalEmpAvatar').attr('src', btn.data('avatar') || 'assets/images/users/avatar-4.jpg');
                $('#modalEmpName').text(btn.data('name'));
                $('#modalEmpId').text(btn.data('empid'));
                $('#modalEmpRole').text(btn.data('role'));
                $('#modalEmpMobile').text(btn.data('mobile'));
                $('#modalEmpAadhaar').text(btn.data('aadhaar'));
                $('#modalEmpLocation').text(btn.data('location'));
                $('#modalEmpSalary').text(btn.data('salary'));
                $('#modalEmpAllowance').text(btn.data('allowance'));
                $('#modalEmpWorkingDays').text(btn.data('workingdays') || '26 Days');
                
                // const status = btn.data('status') || 'Active';
                // $('#modalEmpStatusBadge').text(status)
                //     .removeClass('bg-success bg-danger bg-warning')
                //     .addClass(status === 'Active' ? 'bg-success' : 'bg-danger');

                const modal = new bootstrap.Modal(document.getElementById('viewEmployeeModal'));
                modal.show();
            });
        });
    </script>
