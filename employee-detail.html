<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Employee Details | Drterrace Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Drterrace Employee Management System" name="description" />
    <meta content="Drterrace" name="author" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">

    <!-- Bootstrap Css -->
    <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />
    <!-- Responsive & Typography Custom Css -->
    <link href="assets/css/responsive-custom.css" rel="stylesheet" type="text/css" />

    <style>
        .form-section-title {
            font-size: 1.05rem;
           
            color: var(--dr-primary, #030303);
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eef2f6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-control[readonly],
        .form-select[disabled] {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #1e293b;
           
            cursor: default;
        }

        .form-control:focus {
            border-color: var(--dr-primary, #1e4db7);
            box-shadow: 0 0 0 3px rgba(30, 77, 183, 0.15);
        }

        .card-custom-detail {
            border-radius: 14px;
            border: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            background: #ffffff;
        }

        .status-badge-pill {
            font-size: 0.88rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
        }
    </style>
</head>

<body data-topbar="colored">

    <!-- Begin page -->
    <div id="layout-wrapper">

        <!-- Header Component -->
        <div id="header"></div>

        <!-- Sidebar Component -->
        <div id="sidebar"></div>

        <!-- ============================================================== -->
        <!-- Start right Content here -->
        <!-- ============================================================== -->
        <div class="main-content">
            <div class="page-content">
                <div class="container-fluid">

                    <!-- Start page title -->
                    <div class="row">
                        <div class="col-12">
                            <div class="page-title-box d-flex align-items-center justify-content-between">
                                <div class="page-title">
                                    <h4 class="mb-0 font-size-18" id="pageTitle">Employee Details</h4>
                                    <ol class="breadcrumb">
                                        <li class="breadcrumb-item"><a href="employee-list.html">Drterrace</a></li>
                                        <li class="breadcrumb-item"><a href="employee-list.html">Employee</a></li>
                                        <li class="breadcrumb-item active" id="breadcrumbActive">Employee Details</li>
                                    </ol>
                                </div>

                                <div class="state-information d-flex gap-2">
                                    <a href="employee-list.html" class="btn btn-outline-light shadow-sm" id="backToListTopBtn">
                                        <i class="mdi mdi-arrow-left me-1"></i> Back to Employee List
                                    </a>
                                    
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- End page title -->

                    <!-- Start Page Content Wrapper -->
                    <div class="page-content-wrapper">
                        <div class="row">
                            <div class="col-12">
                                <div class="card card-custom-detail">
                                    <div class="card-body p-4 p-md-5">

                        
                                      

                                        <form id="employeeDetailForm">

                                            <!-- SECTION 1: Personal & Contact Information -->
                                            <div class="form-section-title">
                                                <i class="mdi mdi-account-outline font-size-20"></i>
                                                <span>Personal & Contact Information</span>
                                            </div>

                                            <div class="row g-3 mb-4">
                                                <div class="col-12 col-md-4">
                                                    <label  for="employeeId">Employee ID</label>
                                                    <input type="text" class="form-control" id="employeeId" name="employee_id" value="EMP-001" readonly>
                                                </div>

                                                <div class="col-12 col-md-4">
                                                    <label  for="employeeName">Employee Name</label>
                                                    <input type="text" class="form-control" id="employeeName" name="employee_name" value="Donald Johnson" readonly>
                                                </div>

                                                <div class="col-12 col-md-4">
                                                    <label  for="mobileNumber"> Mobile Number</label>
                                                    <input type="text" class="form-control" id="mobileNumber" name="mobile_number" value="+91 98765 43210" readonly>
                                                </div>

                                                <div class="col-12 col-md-4">
                                                    <label  for="employeeRole">Role / Designation</label>
                                                    <input type="text" class="form-control" id="employeeRole" name="employee_role" value="Field Employee" readonly>
                                                </div>

                                                <div class="col-12 col-md-4">
                                                    <label for="aadhaarNumber">Aadhaar Number</label>
                                                    <input type="text" class="form-control" id="aadhaarNumber" name="aadhaar_number" value="9678 8765 4589" readonly>
                                                </div>
                                            </div>


                                            <!-- SECTION 2: Location Information -->
                                            <div class="form-section-title">
                                                <i class="mdi mdi-map-marker-outline font-size-20"></i>
                                                <span>Location Information</span>
                                            </div>

                                            <div class="row g-3 mb-4">
                                                <div class="col-12 col-md-6">
                                                    <label  for="areaLocality">Area / Locality</label>
                                                    <input type="text" class="form-control" id="areaLocality" name="area_locality" value="Ambattur" readonly>
                                                </div>

                                                <div class="col-12 col-md-6">
                                                    <label  for="city">City</label>
                                                    <input type="text" class="form-control" id="city" name="city" value="Chennai" readonly>
                                                </div>
                                            </div>


                                            <!-- SECTION 3: Salary & Work Details -->
                                            <div class="form-section-title">
                                                <i class="mdi mdi-cash-multiple font-size-20"></i>
                                                <span>Salary & Work Details</span>
                                            </div>

                                            <div class="row g-3 mb-4">
                                                <div class="col-12 col-md-4">
                                                    <label  for="baseSalary">Base Salary</label>
                                                    <input type="text" class="form-control" id="baseSalary" name="base_salary" value="₹25,000" readonly>
                                                </div>

                                                <div class="col-12 col-md-4">
                                                    <label  for="siteAllowance">Site Allowance</label>
                                                    <input type="text" class="form-control" id="siteAllowance" name="site_allowance" value="₹2,000" readonly>
                                                </div>

                                                <div class="col-12 col-md-4">
                                                    <label  for="workingDays">Monthly Working Days</label>
                                                    <input type="text" class="form-control" id="workingDays" name="working_days" value="26 Days" readonly>
                                                </div>
                                            </div>

                                            <!-- Bottom Action Buttons -->
                                            <div class="d-flex align-items-center justify-content-end gap-2 pt-3 border-top">
                                                <a href="employee-list.html" class="btn btn-secondary px-4" id="backToListBtn">
                                                    <i class="mdi mdi-arrow-left me-1"></i> Back to List
                                                </a>

                                                <button type="submit" class="btn btn-success px-4 d-none" id="saveChangesBtn">
                                                    <i class="mdi mdi-content-save-outline me-1"></i> Save Changes
                                                </button>
                                            </div>

                                        </form>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- End Page Content Wrapper -->

                </div>
            </div>

            <!-- Footer Component -->
            <div id="footer"></div>

        </div>

    </div>

    <!-- Right bar overlay-->
    <div class="rightbar-overlay"></div>

    <!-- JAVASCRIPT -->
    <script src="assets/libs/jquery/jquery.min.js"></script>
    <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/libs/metismenu/metisMenu.min.js"></script>
    <script src="assets/libs/simplebar/simplebar.min.js"></script>
    <script src="assets/libs/node-waves/waves.min.js"></script>
    <script src="assets/libs/sweetalert2/sweetalert2.min.js"></script>

    <!-- Component Loader -->
    <script src="assets/js/component-loader.js"></script>

    <!-- App js -->
    <script src="assets/js/app.js"></script>

    <script>
        // Employee Database - matches the rows in employee-list.html
        const employeesDB = {
            "EMP-001": {
                id: "EMP-001",
                name: "Donald Johnson",
                role: "Field Employee",
                mobile: "+91 98765 43210",
                aadhaar: "9678 8765 4589",
                area: "Ambattur",
                city: "Chennai",
                salary: "₹25,000",
                allowance: "₹2,000",
                workingDays: "26 Days"
            },
            "EMP-002": {
                id: "EMP-002",
                name: "Ravi Kumar",
                role: "Site Engineer",
                mobile: "+91 98410 12345",
                aadhaar: "8123 4567 9021",
                area: "Anna Nagar",
                city: "Chennai",
                salary: "₹32,000",
                allowance: "₹3,500",
                workingDays: "26 Days"
            },
            "EMP-003": {
                id: "EMP-003",
                name: "Priya Sundaram",
                role: "Office Employee",
                mobile: "+91 97890 56789",
                aadhaar: "7345 2198 6034",
                area: "Guindy",
                city: "Chennai",
                salary: "₹22,000",
                allowance: "₹1,500",
                workingDays: "24 Days"
            },
            "EMP-004": {
                id: "EMP-004",
                name: "Santhosh Kumar",
                role: "Field Employee",
                mobile: "+91 98401 23456",
                aadhaar: "6289 4471 3305",
                area: "Velachery",
                city: "Chennai",
                salary: "₹25,000",
                allowance: "₹2,000",
                workingDays: "26 Days"
            }
        };

        $(document).ready(function() {
            // Read query param from URL e.g. ?id=EMP-002
            const urlParams = new URLSearchParams(window.location.search);
            const empIdParam = urlParams.get('id') || "EMP-001";

            const data = employeesDB[empIdParam] || employeesDB["EMP-001"];

            // Section 1: Personal & Contact Information
            $('#employeeId').val(data.id);
            $('#employeeName').val(data.name);
            $('#mobileNumber').val(data.mobile);
            $('#employeeRole').val(data.role);
            $('#aadhaarNumber').val(data.aadhaar);

            // Section 2: Location Information
            $('#areaLocality').val(data.area);
            $('#city').val(data.city);

            // Section 3: Salary & Work Details
            $('#baseSalary').val(data.salary);
            $('#siteAllowance').val(data.allowance);
            $('#workingDays').val(data.workingDays);

            // =========================
            // VIEW / EDIT MODE
            // =========================
            const isEditMode = urlParams.get('mode') === 'edit';

            if (isEditMode) {

                // Unlock every field except the ID, which stays a fixed identifier
                $('#employeeDetailForm')
                    .find('.form-control, .form-select')
                    .not('#employeeId')
                    .prop('readonly', false)
                    .prop('disabled', false);

                // Page title & breadcrumb
                $('#pageTitle').text('Edit Employee Details');
                $('#breadcrumbActive').text('Edit Employee');

                // Top & bottom action bars
                $('#backToListTopBtn')
                    .html('<i class="mdi mdi-close me-1"></i> Cancel')
                    .attr('href', 'employee-detail.html?id=' + empIdParam);

                $('#backToListBtn')
                    .html('<i class="mdi mdi-close me-1"></i> Cancel')
                    .attr('href', 'employee-detail.html?id=' + empIdParam);

                $('#saveChangesBtn').removeClass('d-none');
            }

            // =========================
            // SAVE CHANGES (EDIT MODE)
            // =========================
            $('#employeeDetailForm').on('submit', function(e) {
                e.preventDefault();

                if (!isEditMode) {
                    return;
                }

                // TODO: wire this up to your backend / API to persist the changes.
                Swal.fire({
                    title: 'Saved!',
                    text: 'Employee details have been updated successfully.',
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                }).then(function() {
                    window.location.href = 'employee-detail.html?id=' + empIdParam;
                });
            });
        });
    </script>
</body>

</html>
