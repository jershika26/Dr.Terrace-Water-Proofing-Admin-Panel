<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Master - Service | Drterrace Admin Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Waterproof Types & Services Master Management for Drterrace" name="description" />
    <meta content="Drterrace" name="author" />
  <link rel="shortcut icon" href="assets/images/favicon.png">
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">

    <!-- DataTables -->
    <link href="assets/libs/datatables.net-bs4/css/dataTables.bootstrap4.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/libs/datatables.net-buttons-bs4/css/buttons.bootstrap4.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/libs/datatables.net-responsive-bs4/css/responsive.bootstrap4.min.css" rel="stylesheet" type="text/css" />

    <!-- Sweet Alert -->
    <link href="assets/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />

    <!-- Bootstrap Css -->
    <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />

    <!-- Icons Css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />

    <!-- App Css -->
    <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />

    <!-- Responsive Css -->
    <link href="assets/css/responsive-custom.css" rel="stylesheet" type="text/css" />
    <style>
        .spec-option-card {
            border: 1.5px solid #e2e8f0;
            background-color: #ffffff;
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            user-select: none;
        }
        .spec-option-card:hover {
            border-color: #94a3b8;
            background-color: #f8fafc;
        }
        .spec-option-card.active {
            border-color: #1e4db7 !important;
            background-color: rgba(30, 77, 183, 0.04) !important;
            box-shadow: 0 0 0 1px #1e4db7;
        }
        .spec-option-card .form-check-input {
            width: 1.15em;
            height: 1.15em;
            margin-top: 2px;
            cursor: pointer;
        }
        .spec-option-card .form-check-input:checked {
            background-color: #1e4db7;
            border-color: #1e4db7;
        }
    </style>
</head>

<body data-topbar="colored">

    <!-- Begin page -->
    <div id="layout-wrapper">

        <!-- Header Component -->
        <div id="header"></div>

        <!-- Sidebar Component -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div class="main-content">

            <div class="page-content">

                <div class="container-fluid">

                    <!-- Page Title -->
                    <div class="row">
                        <div class="col-12">
                            <div class="page-title-box d-flex align-items-center justify-content-between">
                                <div class="page-title">
                                    <h4 class="mb-0 font-size-18">Service Master</h4>
                                    <ol class="breadcrumb">
                                        <li class="breadcrumb-item"><a href="dashboard.html">Drterrace</a></li>
                                        <li class="breadcrumb-item"><a href="javascript:void(0);">Master</a></li>
                                        <li class="breadcrumb-item active">Service</li>
                                    </ol>
                                </div>

                                <div class="state-information">
                                    <button type="button" class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addWaterproofModal">
                                        <i class="mdi mdi-plus me-1 font-size-16 align-middle"></i>
                                        New Service
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="page-content-wrapper">
                        <div class="row">
                            <div class="col-12">
                                <div class="card shadow-sm border-0" style="border-radius: 12px;">
                                    <div class="card-body p-4">
                                        <div class="d-flex align-items-center justify-content-between mb-3">
                                            <div>
                                                <h5 class="card-title mb-1 text-dark">Waterproof Types & Services</h5>
                                                <p class="text-muted font-size-13 mb-0">Manage services with single or multi-tier specifications.</p>
                                            </div>
                                        </div>

                                        <div class="table-responsive" id="services-table-container">
                                            <table id="datatable-waterproof-types" class="table table-bordered" style="border-collapse: collapse; border-spacing: 0; width: 100%; min-width: 580px;">
                                                <thead>
                                                    <tr>
                                                        <th class="sl-no-col text-center" style="width: 80px;">Sl. No.</th>
                                                        <th>Waterproof Type</th>
                                                        <th>Specification Structure</th>
                                                        <th class="text-center" style="width: 180px;">Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="services-table-body">
                                                    <!-- Dynamically rendered from ServiceStore -->
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- ADD MODAL -->
            <div class="modal fade" id="addWaterproofModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content shadow-lg border-0">
                        <div class="modal-header">
                            <h5 class="modal-title">
                                <i class="mdi mdi-plus-circle-outline me-2"></i>
                                Add Waterproof Type
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form id="addWaterproofForm">
                            <div class="modal-body p-4">
                                <div class="mb-3">
                                    <label class="form-label" for="newTypeName">
                                        Waterproof Type Name <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="newTypeName" placeholder="e.g. Roof Tile Waterproofing" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">
                                        Specification Structure <span class="text-danger">*</span>
                                    </label>
                                    <div class="d-flex flex-column gap-2.5 mt-1">
                                        <label class="spec-option-card active w-100 mb-0" for="specTypeMulti" id="card-new-multi">
                                            <div class="d-flex align-items-center">
                                                <input class="form-check-input me-3 flex-shrink-0" type="radio" name="newSpecType" id="specTypeMulti" value="multi" checked>
                                                <div class="flex-grow-1">
                                                    <div class="fw-bold text-dark font-size-14 d-flex align-items-center">
                                                        <i class="mdi mdi-layers-outline text-primary me-1.5 font-size-17"></i> Multi-Tier
                                                    </div>
                                                    <div class="text-muted font-size-12 mt-0.5">Has multiple tiers (Economy, Standard, Premium, etc.)</div>
                                                </div>
                                            </div>
                                        </label>
                                        <label class="spec-option-card w-100 mb-0" for="specTypeSingle" id="card-new-single">
                                            <div class="d-flex align-items-center">
                                                <input class="form-check-input me-3 flex-shrink-0" type="radio" name="newSpecType" id="specTypeSingle" value="single">
                                                <div class="flex-grow-1">
                                                    <div class="fw-bold text-dark font-size-14 d-flex align-items-center">
                                                        <i class="mdi mdi-file-document-outline text-info me-1.5 font-size-17"></i> Single Spec
                                                    </div>
                                                    <div class="text-muted font-size-12 mt-0.5">Has only 1 single standard specification</div>
                                                </div>
                                            </div>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer bg-light border-0">
                                <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-primary px-4">Save Service</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- EDIT MODAL -->
            <div class="modal fade" id="editWaterproofModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content shadow-lg border-0">
                        <div class="modal-header">
                            <h5 class="modal-title">
                                <i class="mdi mdi-pencil-outline me-2"></i>
                                Edit Waterproof Type
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form id="editWaterproofForm">
                            <input type="hidden" id="editServiceId">
                            <div class="modal-body p-4">
                                <div class="mb-3">
                                    <label class="form-label" for="editTypeName">
                                        Waterproof Type Name <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="editTypeName" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">
                                        Specification Structure <span class="text-danger">*</span>
                                    </label>
                                    <div class="d-flex flex-column gap-2.5 mt-1">
                                        <label class="spec-option-card active w-100 mb-0" for="editSpecTypeMulti" id="card-edit-multi">
                                            <div class="d-flex align-items-center">
                                                <input class="form-check-input me-3 flex-shrink-0" type="radio" name="editSpecType" id="editSpecTypeMulti" value="multi">
                                                <div class="flex-grow-1">
                                                    <div class="fw-bold text-dark font-size-14 d-flex align-items-center">
                                                        <i class="mdi mdi-layers-outline text-primary me-1.5 font-size-17"></i> Multi-Tier
                                                    </div>
                                                    <div class="text-muted font-size-12 mt-0.5">Multiple tier options</div>
                                                </div>
                                            </div>
                                        </label>
                                        <label class="spec-option-card w-100 mb-0" for="editSpecTypeSingle" id="card-edit-single">
                                            <div class="d-flex align-items-center">
                                                <input class="form-check-input me-3 flex-shrink-0" type="radio" name="editSpecType" id="editSpecTypeSingle" value="single">
                                                <div class="flex-grow-1">
                                                    <div class="fw-bold text-dark font-size-14 d-flex align-items-center">
                                                        <i class="mdi mdi-file-document-outline text-info me-1.5 font-size-17"></i> Single Spec
                                                    </div>
                                                    <div class="text-muted font-size-12 mt-0.5">Single standard specification</div>
                                                </div>
                                            </div>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer bg-light border-0">
                                <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-primary px-4">Update Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div id="footer"></div>

        </div>

    </div>

    <!-- Right bar overlay -->
    <div class="rightbar-overlay"></div>

    <!-- JAVASCRIPT -->
    <script src="assets/libs/jquery/jquery.min.js"></script>
    <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/libs/metismenu/metisMenu.min.js"></script>
    <script src="assets/libs/simplebar/simplebar.min.js"></script>
    <script src="assets/libs/node-waves/waves.min.js"></script>
    <script src="assets/libs/sweetalert2/sweetalert2.min.js"></script>
    <script src="assets/libs/datatables.net/js/jquery.dataTables.min.js"></script>
    <script src="assets/libs/datatables.net-bs4/js/dataTables.bootstrap4.min.js"></script>
    <!-- Responsive examples -->
    <script src="assets/libs/datatables.net-responsive/js/dataTables.responsive.min.js"></script>
    <script src="assets/libs/datatables.net-responsive-bs4/js/responsive.bootstrap4.min.js"></script>

    <!-- Services Store -->
    <script src="assets/js/services-data.js"></script>

    <!-- Component Loader -->
    <script src="assets/js/component-loader.js"></script>

    <!-- App JS -->
    <script src="assets/js/app.js"></script>

    <script>
        $(document).ready(function () {
            let dataTable = null;

            function renderServicesTable() {
                const services = ServiceStore.getAllServices();
                const container = $('#services-table-container');

                if (dataTable) {
                    dataTable.destroy();
                    dataTable = null;
                }
                container.empty();

                let rowsHtml = '';
                if (services.length === 0) {
                    rowsHtml = `
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">
                                No services found. Click <strong>New Service</strong> to add one.
                            </td>
                        </tr>
                    `;
                } else {
                    services.forEach((service, index) => {
                        const count = (service.specs && service.specs.length) || 0;
                        const typeText = service.specType === 'single'
                            ? 'Single Spec'
                            : `Multi-Tier (${count} Tier${count === 1 ? '' : 's'})`;

                        rowsHtml += `
                            <tr data-id="${service.id}">
                                <td class="text-center">${index + 1}</td>
                                <td>
                                    <span class="wt-name">${service.name}</span>
                                </td>
                                <td>${typeText}</td>
                                <td class="text-center">
                                    <div class="d-inline-flex gap-1 align-items-center">
                                        <a href="master-viewservice.html?id=${service.id}" class="btn btn-primary btn-sm waves-effect waves-light px-2.5" title="View Service Details">
                                            <i class="mdi mdi-eye-outline me-1"></i>View Service
                                        </a>
                                        <button type="button" class="btn btn-outline-secondary btn-sm btn-edit-service" data-id="${service.id}" title="Edit Service">
                                            <i class="fas fa-pencil-alt"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm btn-delete-service" data-id="${service.id}" title="Delete Service">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                }

                const tableHtml = `
                    <table id="datatable-waterproof-types" class="table table-bordered" style="border-collapse: collapse; border-spacing: 0; width: 100%; min-width: 580px;">
                        <thead>
                            <tr>
                                <th class="sl-no-col text-center" style="width: 80px;">Sl. No.</th>
                                <th>Waterproof Type</th>
                                <th>Specification Structure</th>
                                <th class="text-center" style="width: 180px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="services-table-body">
                            ${rowsHtml}
                        </tbody>
                    </table>
                `;
                container.html(tableHtml);

                if (services.length > 0) {
                    dataTable = $('#datatable-waterproof-types').DataTable({
                        paging: false,
                        searching: false,
                        info: false,
                        lengthChange: false,
                        autoWidth: false,
                        responsive: false,
                        order: [],
                        columnDefs: [
                            { orderable: false, targets: [3] },
                            { className: 'sl-no-col text-center', targets: 0 },
                            { className: 'text-center', targets: 3 }
                        ]
                    });
                }
            }

            renderServicesTable();

            // Spec Option Card Active Sync
            $('input[name="newSpecType"]').on('change', function () {
                $('#card-new-multi, #card-new-single').removeClass('active');
                $(this).closest('.spec-option-card').addClass('active');
            });

            $('input[name="editSpecType"]').on('change', function () {
                $('#card-edit-multi, #card-edit-single').removeClass('active');
                $(this).closest('.spec-option-card').addClass('active');
            });

            /*   ADD SERVICE */
            $('#addWaterproofForm').on('submit', function (e) {
                e.preventDefault();
                const name = $('#newTypeName').val().trim();
                const specType = $('input[name="newSpecType"]:checked').val() || 'multi';

                if (!name) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Required',
                        text: 'Please enter a waterproof type name.',
                        confirmButtonColor: '#1e4db7'
                    });
                    return;
                }

                ServiceStore.addService(name, specType);
                $('#addWaterproofForm')[0].reset();
                $('#specTypeMulti').prop('checked', true).trigger('change');

                const addModal = bootstrap.Modal.getInstance(document.getElementById('addWaterproofModal'));
                if (addModal) addModal.hide();

                renderServicesTable();

                Swal.fire({
                    title: 'Added!',
                    text: `"${name}" has been created successfully.`,
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                });
            });

            /*    EDIT SERVICE*/
            $(document).on('click', '.btn-edit-service', function () {
                const serviceId = $(this).data('id');
                const service = ServiceStore.getServiceById(serviceId);
                if (!service) return;

                $('#editServiceId').val(service.id);
                $('#editTypeName').val(service.name);
                if (service.specType === 'single') {
                    $('#editSpecTypeSingle').prop('checked', true).trigger('change');
                } else {
                    $('#editSpecTypeMulti').prop('checked', true).trigger('change');
                }

                const editModal = new bootstrap.Modal(document.getElementById('editWaterproofModal'));
                editModal.show();
            });

            $('#editWaterproofForm').on('submit', function (e) {
                e.preventDefault();
                const serviceId = $('#editServiceId').val();
                const newName = $('#editTypeName').val().trim();
                const specType = $('input[name="editSpecType"]:checked').val() || 'multi';

                if (!newName) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Required',
                        text: 'Please enter a waterproof type name.',
                        confirmButtonColor: '#1e4db7'
                    });
                    return;
                }

                ServiceStore.updateService(serviceId, { name: newName, specType: specType });

                const editModal = bootstrap.Modal.getInstance(document.getElementById('editWaterproofModal'));
                if (editModal) editModal.hide();

                renderServicesTable();

                Swal.fire({
                    title: 'Updated!',
                    text: `"${newName}" has been updated successfully.`,
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                });
            });

            /*  DELETE SERVICE*/
            $(document).on('click', '.btn-delete-service', function () {
                const serviceId = $(this).data('id');
                const service = ServiceStore.getServiceById(serviceId);
                if (!service) return;

                Swal.fire({
                    title: 'Are you sure?',
                    text: `Do you want to delete "${service.name}"? This action cannot be undone.`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#dc2626',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Yes, delete it!',
                    cancelButtonText: 'Cancel'
                }).then((result) => {
                    if (result.isConfirmed) {
                        ServiceStore.deleteService(serviceId);
                        renderServicesTable();

                        Swal.fire({
                            title: 'Deleted!',
                            text: `"${service.name}" has been removed successfully.`,
                            icon: 'success',
                            timer: 1800,
                            showConfirmButton: false
                        });
                    }
                });
            });

        });
    </script>

</body>

</html>
