    <style>

        /* =========================
           SECTION TITLE
        ========================== */

        .form-section-title {
            font-size: 1.05rem;
            color: var(--dr-primary, #1e4db7);
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eef2f6;
            display: flex;
            align-items: center;
            gap: 8px;
        }


        /* =========================
           READ ONLY INPUT
        ========================== */

        .form-control[readonly],
        .form-select[disabled] {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #1e293b;
            cursor: default;
        }


        /* =========================
           FOCUS
        ========================== */

        .form-control:focus {
            border-color: var(--dr-primary, #1e4db7);
            box-shadow: 0 0 0 3px rgba(30, 77, 183, 0.15);
        }


        /* =========================
           CARD
        ========================== */

        .card-custom-detail {
            border-radius: 14px;
            border: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            background: #ffffff;
        }


        /* =========================
           GOOGLE LOCATION ICON
        ========================== */

        .input-icon-wrapper {
            position: relative;
        }

        .input-trailing-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 18px;
        }

        .input-icon-wrapper .form-control {
            padding-right: 42px;
        }


        /* =========================
           TEXTAREA
        ========================== */

        textarea.form-control {
            resize: none;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 576px) {

            .state-information {
                margin-top: 10px;
            }

            .page-title-box {
                flex-direction: column;
                align-items: flex-start !important;
            }

        }

    </style>

</head>


<body data-topbar="colored">

    <!-- Begin Page -->

    <div id="layout-wrapper">


        <!-- Header Component -->

        <div id="header"></div>


        <!-- Sidebar Component -->

        <div id="sidebar"></div>


        <!-- Main Content -->

        <div class="main-content">


            <div class="page-content">


                <div class="container-fluid">


                    <!-- PAGE TITLE -->

                    <div class="row">

                        <div class="col-12">

                            <div class="page-title-box d-flex align-items-center justify-content-between">

                                <div class="page-title">

                                    <h4 class="mb-0 font-size-18" id="pageTitle">

                                        Customer Details

                                    </h4>


                                    <ol class="breadcrumb">

                                        <li class="breadcrumb-item">

                                            <a href="customer-list.html">

                                                Drterrace

                                            </a>

                                        </li>


                                        <li class="breadcrumb-item">

                                            <a href="customer-list.html">

                                                Customer

                                            </a>

                                        </li>


                                        <li class="breadcrumb-item active" id="breadcrumbActive">

                                            Customer Details

                                        </li>

                                    </ol>

                                </div>


                                <div class="state-information d-flex gap-2">

                                    <a href="customer-list.html"
                                        class="btn btn-outline-light shadow-sm"
                                        id="backToListTopBtn">

                                        <i class="mdi mdi-arrow-left me-1"></i>

                                        Back to Customer List

                                    </a>


                                    <button type="button"
                                        class="btn btn-primary shadow-sm"
                                        id="editCustomerBtn">

                                        <i class="mdi mdi-pencil me-1"></i>

                                        Edit Customer

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- PAGE CONTENT -->

                    <div class="page-content-wrapper">

                        <div class="row">

                            <div class="col-12">

                                <div class="card card-custom-detail">


                                    <div class="card-body p-4 p-md-5">


                                        <form id="customerDetailForm">


                                            <!-- =========================
                                                 PERSONAL INFORMATION
                                            ========================== -->
                                            <div class="form-section-title">
                                                <i class="mdi mdi-account-outline font-size-20"></i>
                                                <span>Personal & Contact Information</span>
                                            </div>

                                            <div class="row g-3 mb-4">
                                                <!-- Customer ID -->
                                                <div class="col-12 col-md-4">
                                                    <label for="customerId">Customer ID</label>
                                                    <input type="text" class="form-control" id="customerId" readonly>
                                                </div>

                                                <!-- Customer Name -->
                                                <div class="col-12 col-md-4">
                                                    <label for="customerName">Customer Name</label>
                                                    <input type="text" class="form-control" id="customerName" readonly>
                                                </div>

                                                <!-- Mobile -->
                                                <div class="col-12 col-md-4">
                                                    <label for="mobileNumber">Mobile Number</label>
                                                    <input type="text" class="form-control" id="mobileNumber" readonly>
                                                </div>
                                            </div>


                                            <!-- =========================
                                                 LOCATION INFORMATION
                                            ========================== -->
                                            <div class="form-section-title">
                                                <i class="mdi mdi-map-marker-outline font-size-20"></i>
                                                <span>Location & Address Information</span>
                                            </div>

                                            <div class="row g-3 mb-4">
                                                <!-- Door No -->
                                                <div class="col-12 col-md-4">
                                                    <label for="doorFlatNo">Door No / Flat No</label>
                                                    <input type="text" class="form-control" id="doorFlatNo" readonly>
                                                </div>

                                                <!-- Street -->
                                                <div class="col-12 col-md-4">
                                                    <label for="streetRoad">Street Name / Road</label>
                                                    <input type="text" class="form-control" id="streetRoad" readonly>
                                                </div>

                                                <!-- Pincode -->
                                                <div class="col-12 col-md-4">
                                                    <label for="pincode">Pincode</label>
                                                    <input type="text" class="form-control" id="pincode" readonly>
                                                </div>

                                                <!-- Area -->
                                                <div class="col-12 col-md-6">
                                                    <label for="areaLocality">Area / Locality</label>
                                                    <input type="text" class="form-control" id="areaLocality" readonly>
                                                </div>

                                                <!-- City -->
                                                <div class="col-12 col-md-6">
                                                    <label for="city">City</label>
                                                    <input type="text" class="form-control" id="city" readonly>
                                                </div>

                                                <!-- Google Location -->
                                                <div class="col-12">
                                                    <label for="googleLocation">Google Location</label>
                                                    <div class="input-icon-wrapper">
                                                        <input type="text" class="form-control" id="googleLocation" readonly>
                                                        <i class="mdi mdi-map-marker input-trailing-icon"></i>
                                                    </div>
                                                </div>
                                            </div>


                                            <!-- =========================
                                                 SERVICE INFORMATION
                                            ========================== -->
                                            <div class="form-section-title">
                                                <i class="mdi mdi-wrench-outline font-size-20"></i>
                                                <span>Service & Assignment Information</span>
                                            </div>

                                            <div class="row g-3 mb-4">
                                                <!-- Services -->
                                                <div class="col-12 col-md-6">
                                                    <label for="serviceRequired">Service(s) Requested</label>
                                                    <input type="text" class="form-control" id="serviceRequired" readonly>
                                                </div>

                                                <!-- Employee -->
                                                <div class="col-12 col-md-6">
                                                    <label for="assignedTo">Assigned Specialist / Employee</label>
                                                    <input type="text" class="form-control" id="assignedTo" readonly>
                                                </div>

                                                <!-- Appointment Date -->
                                                <div class="col-12 col-md-4">
                                                    <label for="appointmentDate">Appointment Date</label>
                                                    <input type="text" class="form-control" id="appointmentDate" readonly>
                                                </div>

                                                <!-- Appointment Fix Date -->
                                                <div class="col-12 col-md-4">
                                                    <label for="appointmentFixDate">Appointment Fix Date</label>
                                                    <input type="text" class="form-control" id="appointmentFixDate" readonly>
                                                </div>

                                                <!-- Appointment Time -->
                                                <div class="col-12 col-md-4">
                                                    <label for="appointmentTime">Appointment Time</label>
                                                    <input type="text" class="form-control" id="appointmentTime" readonly>
                                                </div>

                                                <!-- Property Type -->
                                                <div class="col-12 col-md-3">
                                                    <label for="propertyType">Property / Structure Type</label>
                                                    <input type="text" class="form-control" id="propertyType" readonly>
                                                </div>

                                                <!-- Estimated Area -->
                                                <div class="col-12 col-md-3">
                                                    <label for="estimatedArea">Estimated Area</label>
                                                    <input type="text" class="form-control" id="estimatedArea" readonly>
                                                </div>

                                                <!-- Quotation Status -->
                                                <div class="col-12 col-md-3">
                                                    <label for="quotationStatus">Quotation Status</label>
                                                    <input type="text" class="form-control" id="quotationStatus" readonly>
                                                </div>

                                                <!-- Current Status -->
                                                <div class="col-12 col-md-3">
                                                    <label for="currentStatus">Current Status</label>
                                                    <input type="text" class="form-control" id="currentStatus" readonly>
                                                </div>
                                            </div>


                                           

                                            <!-- =========================
                                                 ACTION BUTTONS
                                            ========================== -->

                                            <div class="d-flex align-items-center justify-content-end gap-2 pt-3 border-top">


                                                <a href="customer-list.html"
                                                    class="btn btn-secondary px-4"
                                                    id="backToListBtn">

                                                    <i class="mdi mdi-arrow-left me-1"></i>

                                                    Back to List

                                                </a>


                                                <a href="new-appointment.html"
                                                    class="btn btn-primary px-4"
                                                    id="bookRescheduleBtn">

                                                    <i class="mdi mdi-calendar-edit me-1"></i>

                                                    Book / Reschedule

                                                </a>


                                                <button type="submit"
                                                    class="btn btn-success px-4 d-none"
                                                    id="saveChangesBtn">

                                                    <i class="mdi mdi-content-save-outline me-1"></i>

                                                    Save Changes

                                                </button>


                                            </div>


                                        </form>


                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                </div>

            </div>


            <!-- Footer -->

            <div id="footer"></div>


        </div>


    </div>


    <!-- Right Bar Overlay -->

    <div class="rightbar-overlay"></div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="assets/libs/jquery/jquery.min.js"></script>

    <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="assets/libs/metismenu/metisMenu.min.js"></script>

    <script src="assets/libs/simplebar/simplebar.min.js"></script>

    <script src="assets/libs/node-waves/waves.min.js"></script>

    <script src="assets/libs/sweetalert2/sweetalert2.min.js"></script>


    <!-- Component Loader -->

    <script src="assets/js/component-loader.js"></script>


    <!-- App JS -->

    <script src="assets/js/app.js"></script>


    <script>

        /* =========================
           CUSTOMER DATABASE
        ========================== */

        const customersDB = {

            "CUST-1001": {
                id: "CUST-1001",
                name: "Kavitha Narayanan",
                mobile: "+91 98401 23456",
                type: "Individual Homeowner",
                doorNo: "Flat 3A",
                street: "MTH Road",
                area: "Ambattur",
                city: "Chennai",
                pincode: "600053",
                googleLocation: "https://maps.google.com/",
                services: "Outer Wall Proofing, Terrace Waterproofing",
                assigned: "Santhosh Kumar (Field Specialist)",
                date: "19-08-2026",
                fixDate: "20-08-2026",
                time: "05:30 PM",
                propertyType: "Residential Apartment Building",
                estimatedArea: "1,450 Sq. Ft.",
                quoteStatus: "Inspection Pending",
                status: "Scheduled",
                notes: "Severe terrace leakage observed near the overhead water tank area during heavy rains. Also external wall dampness and paint peeling on the second-floor northern wall.",
                specialistNotes: "Initial visit scheduled. Need moisture meter inspection for parapet wall joints and elastomeric coating quotation preparation."
            },

            "CUST-1002": {
                id: "CUST-1002",
                name: "Murugan Selvam",
                mobile: "+91 97892 34567",
                type: "Residential Owner",
                doorNo: "No 45",
                street: "2nd Main Road",
                area: "Anna Nagar",
                city: "Chennai",
                pincode: "600040",
                googleLocation: "https://maps.google.com/",
                services: "Bathroom Proofing, Sump Proofing",
                assigned: "Alex (Site Engineer)",
                date: "20-08-2026",
                fixDate: "21-08-2026",
                time: "10:00 AM",
                propertyType: "Independent Villa",
                estimatedArea: "850 Sq. Ft.",
                quoteStatus: "Quotation Generated (₹38,000)",
                status: "In Progress",
                notes: "Underground water sump leakage and seepage into neighboring foundation. Master bathroom tile joints damaged causing water stains on ceiling below.",
                specialistNotes: "Sump pressure grouting in progress. Bathroom floor epoxy coating to commence on Saturday."
            },

            "CUST-1003": {
                id: "CUST-1003",
                name: "Rajesh Varma",
                mobile: "+91 99403 45678",
                type: "Commercial Property",
                doorNo: "Plot 12",
                street: "GST Road, Industrial Estate",
                area: "Guindy",
                city: "Chennai",
                pincode: "600032",
                googleLocation: "https://maps.google.com/",
                services: "Outer Wall Proofing",
                assigned: "Donald Johnson (Field Lead)",
                date: "18-08-2026",
                fixDate: "19-08-2026",
                time: "02:15 PM",
                propertyType: "Commercial Complex (G+4)",
                estimatedArea: "6,200 Sq. Ft.",
                quoteStatus: "Completed (₹1,45,000)",
                status: "Completed",
                notes: "External glass and concrete facade silicone seal restoration and 3-coat waterproof exterior painting.",
                specialistNotes: "Job completed with 5-year warranty card issued to facility management."
            },

            "CUST-1004": {
                id: "CUST-1004",
                name: "Ananya Srinivasan",
                mobile: "+91 98415 67890",
                type: "Individual Homeowner",
                doorNo: "7B",
                street: "North Usman Road",
                area: "T. Nagar",
                city: "Chennai",
                pincode: "600017",
                googleLocation: "https://maps.google.com/",
                services: "Terrace Waterproofing, Sump Proofing",
                assigned: "Ravi Kumar (Site Engineer)",
                date: "21-08-2026",
                fixDate: "22-08-2026",
                time: "11:30 AM",
                propertyType: "Residential Independent House",
                estimatedArea: "1,800 Sq. Ft.",
                quoteStatus: "Pending Approval",
                status: "Scheduled",
                notes: "Old building flat roof waterproofing with heat insulation and sump inner waterproof plastering.",
                specialistNotes: "Roof surface preparation checklist submitted. Awaiting client quote confirmation."
            }

        };


        /* =========================
           LOAD CUSTOMER DETAILS
        ========================== */

        $(document).ready(function () {

            const urlParams = new URLSearchParams(
                window.location.search
            );

            const customerIdParam =
                urlParams.get('id') || "CUST-1001";

            const data =
                customersDB[customerIdParam]
                || customersDB["CUST-1001"];

            function populateData() {
                /* PERSONAL INFORMATION */
                $('#customerId').val(data.id);
                $('#customerName').val(data.name);
                $('#mobileNumber').val(data.mobile);

                /* LOCATION */
                $('#doorFlatNo').val(data.doorNo);
                $('#streetRoad').val(data.street);
                $('#areaLocality').val(data.area);
                $('#city').val(data.city);
                $('#pincode').val(data.pincode);
                $('#googleLocation').val(data.googleLocation);

                /* SERVICE */
                $('#serviceRequired').val(data.services);
                $('#assignedTo').val(data.assigned);
                $('#appointmentDate').val(data.date);
                $('#appointmentFixDate').val(data.fixDate || data.date);
                $('#appointmentTime').val(data.time);
                $('#propertyType').val(data.propertyType);
                $('#estimatedArea').val(data.estimatedArea);
                $('#quotationStatus').val(data.quoteStatus);
                $('#currentStatus').val(data.status);

                /* NOTES */
                $('#customerNotes').val(data.notes);
                $('#siteEngineerNotes').val(data.specialistNotes);
            }

            populateData();

            let isEditMode = false;

            function enableEditMode() {
                isEditMode = true;

                /* Unlock every field including the ID */
                $('#customerDetailForm')
                    .find('.form-control, .form-select')
                    .prop('readonly', false)
                    .prop('disabled', false);

                /* Page title & breadcrumb */
                $('#pageTitle').text('Edit Customer Details');
                $('#breadcrumbActive').text('Edit Customer');

                /* Top action button switches to Cancel */
                $('#editCustomerBtn')
                    .html('<i class="mdi mdi-close me-1"></i> Cancel')
                    .removeClass('btn-primary')
                    .addClass('btn-outline-light');

                /* Bottom action bar */
                $('#bookRescheduleBtn').addClass('d-none');
                $('#backToListBtn')
                    .html('<i class="mdi mdi-close me-1"></i> Cancel')
                    .attr('href', 'javascript:void(0);');

                $('#saveChangesBtn').removeClass('d-none');
                $('#customerId').focus();
            }

            function disableEditMode() {
                isEditMode = false;

                /* Reset form fields */
                populateData();

                /* Lock all fields */
                $('#customerDetailForm')
                    .find('.form-control, .form-select')
                    .prop('readonly', true)
                    .prop('disabled', true);

                /* Page title & breadcrumb */
                $('#pageTitle').text('Customer Details');
                $('#breadcrumbActive').text('Customer Details');

                /* Top action button switches back */
                $('#editCustomerBtn')
                    .html('<i class="mdi mdi-pencil me-1"></i> Edit Customer')
                    .removeClass('btn-outline-light')
                    .addClass('btn-primary');

                /* Bottom action bar */
                $('#bookRescheduleBtn').removeClass('d-none');
                $('#backToListBtn')
                    .html('<i class="mdi mdi-arrow-left me-1"></i> Back to List')
                    .attr('href', 'customer-list.html');

                $('#saveChangesBtn').addClass('d-none');
            }

            /* Top Edit / Cancel Button Click Handler */
            $('#editCustomerBtn').on('click', function () {
                if (isEditMode) {
                    disableEditMode();
                } else {
                    enableEditMode();
                }
            });

            /* Bottom Cancel Button Click Handler in Edit Mode */
            $('#backToListBtn').on('click', function (e) {
                if (isEditMode) {
                    e.preventDefault();
                    disableEditMode();
                }
            });

            /* Initial check if mode=edit is in URL */
            if (urlParams.get('mode') === 'edit') {
                enableEditMode();
            }

            /* =========================
               SAVE CHANGES (EDIT MODE)
            ========================== */
            $('#customerDetailForm').on('submit', function (e) {
                e.preventDefault();

                if (!isEditMode) {
                    return;
                }

                // Update data in-memory
                data.id = $('#customerId').val();
                data.name = $('#customerName').val();
                data.mobile = $('#mobileNumber').val();
                data.doorNo = $('#doorFlatNo').val();
                data.street = $('#streetRoad').val();
                data.area = $('#areaLocality').val();
                data.city = $('#city').val();
                data.pincode = $('#pincode').val();
                data.googleLocation = $('#googleLocation').val();
                data.services = $('#serviceRequired').val();
                data.assigned = $('#assignedTo').val();
                data.date = $('#appointmentDate').val();
                data.fixDate = $('#appointmentFixDate').val();
                data.time = $('#appointmentTime').val();
                data.propertyType = $('#propertyType').val();
                data.estimatedArea = $('#estimatedArea').val();
                data.quoteStatus = $('#quotationStatus').val();
                data.status = $('#currentStatus').val();
                data.notes = $('#customerNotes').val();
                data.specialistNotes = $('#siteEngineerNotes').val();

                Swal.fire({
                    title: 'Saved!',
                    text: 'Customer details have been updated successfully.',
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                }).then(function () {
                    disableEditMode();
                });
            });

        });

    </script>


</body>
</html>
