        /* =========================

        ========================== */

        $(document).ready(function () {


            const urlParams = new URLSearchParams(
                window.location.search
            );


            const customerIdParam =
                urlParams.get('id') || "CUST-1001";


            const data =
                customersDB[customerIdParam]
                || customersDB["CUST-1001"];


            /* PERSONAL INFORMATION */

            $('#customerId').val(data.id);

            $('#customerName').val(data.name);

            $('#mobileNumber').val(data.mobile);

            $('#altMobileNumber').val(data.altMobile);

            $('#emailAddress').val(data.email);

            $('#customerType').val(data.type);


            /* LOCATION */

            $('#doorFlatNo').val(data.doorNo);

            $('#buildingName').val(data.building);

            $('#streetRoad').val(data.street);

            $('#areaLocality').val(data.area);

            $('#city').val(data.city);

            $('#pincode').val(data.pincode);

            $('#landmark').val(data.landmark);

            $('#googleLocation').val(data.googleLocation);


            /* SERVICE */

            $('#serviceRequired').val(data.services);

            $('#assignedTo').val(data.assigned);

            $('#appointmentDate').val(data.date);

            $('#appointmentTime').val(data.time);

            $('#propertyType').val(data.propertyType);

            $('#estimatedArea').val(data.estimatedArea);

            $('#quotationStatus').val(data.quoteStatus);

            $('#currentStatus').val(data.status);


            /* NOTES */

            $('#customerNotes').val(data.notes);

            $('#siteEngineerNotes').val(
                data.specialistNotes
            );


            /* =========================
               VIEW / EDIT MODE
            ========================== */

            const isEditMode =
                urlParams.get('mode') === 'edit';


            if (isEditMode) {

                /* Unlock every field except the ID,
                   which stays a fixed identifier */

                $('#customerDetailForm')
                    .find('.form-control, .form-select')
                    .not('#customerId')
                    .prop('readonly', false)
                    .prop('disabled', false);


                /* Page title & breadcrumb */

                $('#pageTitle').text('Edit Customer Details');

                $('#breadcrumbActive').text('Edit Customer');


                /* Top action bar */

                $('#newAppointmentBtn').addClass('d-none');

                // $('#backToListTopBtn')
                //     .html('<i class="mdi mdi-close me-1"></i> Cancel')
                //     .attr('href', 'customer-detail.html?id=' + customerIdParam);

                $('#backToListBtn')
                    .html('<i class="mdi mdi-close me-1"></i> Cancel')
                    .attr('href', 'customer-detail.html?id=' + customerIdParam);

                $('#saveChangesBtn').removeClass('d-none');

            /* =========================
               SAVE CHANGES (EDIT MODE)
            ========================== */

            $('#customerDetailForm').on('submit', function (e) {

                if (!isEditMode) {

                Swal.fire({

                }).then(function () {

                        'customer-detail.html?id=' + customerIdParam;

                });

            });
