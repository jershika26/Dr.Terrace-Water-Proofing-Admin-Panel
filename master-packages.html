<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Master - Packages | Drterrace Admin Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Drterrace" name="author" />
      <link rel="shortcut icon" href="assets/images/favicon.png">
      

    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">

    <!-- DataTables -->
    <link href="assets/libs/datatables.net-bs4/css/dataTables.bootstrap4.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/libs/datatables.net-buttons-bs4/css/buttons.bootstrap4.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/libs/datatables.net-responsive-bs4/css/responsive.bootstrap4.min.css" rel="stylesheet" type="text/css" />

    <!-- Sweet Alert -->
    <link href="assets/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />

    <!-- Bootstrap Css -->
    <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />

    <!-- Icons Css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />

    <!-- App Css -->
    <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />

    <!-- Responsive Css -->
    <link href="assets/css/responsive-custom.css" rel="stylesheet" type="text/css" />
</head>

<body data-topbar="colored">

    <!-- Begin page -->
    <div id="layout-wrapper">

        <!-- Header Component -->
        <div id="header"></div>

        <!-- Sidebar Component -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div class="main-content">

            <div class="page-content">

                <div class="container-fluid">

                    <!-- Page Title -->
                    <div class="row">
                        <div class="col-12">
                            <div class="page-title-box d-flex align-items-center justify-content-between">
                                <div class="page-title">
                                    <h4 class="mb-0 font-size-18">Packages</h4>
                                    <ol class="breadcrumb">
                                        <li class="breadcrumb-item"><a href="employee-list.html">Drterrace</a></li>
                                        <li class="breadcrumb-item"><a href="javascript:void(0);">Master</a></li>
                                        <li class="breadcrumb-item active">Packages</li>
                                    </ol>
                                </div>
                                <div class="state-information">
                                    <button type="button" class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addPackageModal">
                                        <i class="mdi mdi-plus me-1 font-size-16 align-middle"></i>
                                        New Packages
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="page-content-wrapper">
                        <div class="row">
                            <div class="col-12">
                                <div class="card shadow-sm border-0" style="border-radius: 12px;">
                                    <div class="card-body p-4">
                                        <div class="mb-3">
                                            <h5 class="card-title mb-1 text-dark">Service Packages</h5>
                                        </div>

                                         <div class="table-responsive" id="packages-table-container">
                                            <table id="datatable-packages" class="table table-bordered" style="border-collapse: collapse; border-spacing: 0; width: 100%; min-width: 480px;">
                                                <thead>
                                                    <tr>
                                                        <th class="sl-no-col" style="width: 100px;">Sl. No.</th>
                                                        <th>Package Name</th>
                                                        <th>Warranty</th>
                                                        <th class="text-center" style="width: 150px;">Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="packages-table-body">
                                                    <!-- Dynamic rows rendered by JavaScript -->
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- ADD MODAL -->
            <div class="modal fade" id="addPackageModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content shadow-lg border-0">
                        <div class="modal-header">
                            <h5 class="modal-title">
                                <i class="mdi mdi-plus-circle-outline me-2"></i>
                                Add Package
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <form id="addPackageForm">
                            <div class="modal-body p-4">
                                <div class="mb-3">
                                    <label for="newPackageName" class="form-label">
                                        Package Name <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="newPackageName" placeholder="Enter package name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="newPackageWarranty" class="form-label">
                                        Warranty (Years) <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" class="form-control" id="newPackageWarranty" placeholder="Enter warranty in years" min="1" required>
                                </div>
                            </div>
                            <div class="modal-footer bg-light border-0">
                                <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-primary px-4">Save Package</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- EDIT MODAL -->
            <div class="modal fade" id="editPackageModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content shadow-lg border-0">
                        <div class="modal-header">
                            <h5 class="modal-title">
                                <i class="mdi mdi-pencil-outline me-2"></i>
                                Edit Package
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <form id="editPackageForm">
                            <input type="hidden" id="editPackageId">
                            <div class="modal-body p-4">
                                <div class="mb-3">
                                    <label for="editPackageName" class="form-label">
                                        Package Name <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="editPackageName" placeholder="Enter package name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editPackageWarranty" class="form-label">
                                        Warranty (Years) <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" class="form-control" id="editPackageWarranty" placeholder="Enter warranty in years" min="1" required>
                                </div>
                            </div>
                            <div class="modal-footer bg-light border-0">
                                <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-primary px-4">Update Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div id="footer"></div>

        </div>
    </div>

    <div class="rightbar-overlay"></div>

    <!-- JAVASCRIPT -->
    <script src="assets/libs/jquery/jquery.min.js"></script>
    <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/libs/metismenu/metisMenu.min.js"></script>
    <script src="assets/libs/simplebar/simplebar.min.js"></script>
    <script src="assets/libs/node-waves/waves.min.js"></script>
    <script src="assets/libs/sweetalert2/sweetalert2.min.js"></script>
    <script src="assets/libs/datatables.net/js/jquery.dataTables.min.js"></script>
    <script src="assets/libs/datatables.net-bs4/js/dataTables.bootstrap4.min.js"></script>
    <!-- Responsive examples -->
    <script src="assets/libs/datatables.net-responsive/js/dataTables.responsive.min.js"></script>
    <script src="assets/libs/datatables.net-responsive-bs4/js/responsive.bootstrap4.min.js"></script>

    <!-- Services & Packages Data Store -->
    <script src="assets/js/services-data.js"></script>

    <!-- Component Loader -->
    <script src="assets/js/component-loader.js"></script>

    <!-- App JS -->
    <script src="assets/js/app.js"></script>

    <script>
        $(document).ready(function () {
            let dataTable = null;

            function renderPackagesTable() {
                const packages = PackageStore.getAllPackages();
                const container = $('#packages-table-container');

                if (dataTable) {
                    dataTable.destroy();
                    dataTable = null;
                }
                container.empty();

                let rowsHtml = '';
                if (packages.length === 0) {
                    rowsHtml = `
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">
                                No packages added yet. Click <strong>New</strong> to add a package.
                            </td>
                        </tr>
                    `;
                } else {
                    packages.forEach((pkg, index) => {
                        rowsHtml += `
                            <tr data-id="${pkg.id}">
                                <td class="sl-no-col">${index + 1}</td>
                                <td>
                                    <span class="pkg-name">${pkg.name}</span>
                                </td>
                                <td>
                                    <span class="pkg-warranty">${pkg.warranty}</span>
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-outline-secondary btn-sm btn-edit-pkg me-1" data-id="${pkg.id}" title="Edit">
                                        <i class="fas fa-pencil-alt"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm btn-delete-pkg" data-id="${pkg.id}" title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }

                const tableHtml = `
                    <table id="datatable-packages" class="table table-bordered" style="border-collapse: collapse; border-spacing: 0; width: 100%; min-width: 480px;">
                        <thead>
                            <tr>
                                <th class="sl-no-col" style="width: 100px;">Sl. No.</th>
                                <th>Package Name</th>
                                <th>Warranty</th>
                                <th class="text-center" style="width: 150px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="packages-table-body">
                            ${rowsHtml}
                        </tbody>
                    </table>
                `;
                container.html(tableHtml);

                if (packages.length > 0) {
                    dataTable = $('#datatable-packages').DataTable({
                        paging: false,
                        searching: false,
                        info: false,
                        lengthChange: false,
                        autoWidth: false,
                        responsive: false,
                        order: [],
                        columnDefs: [
                            { orderable: false, targets: [3] },
                            { className: 'sl-no-col', targets: 0 },
                            { className: 'text-center', targets: 3 }
                        ]
                    });
                }
            }

            // Initial render
            renderPackagesTable();

            /* =========================
               EDIT PACKAGE
            ========================== */
            $(document).on('click', '.btn-edit-pkg', function () {
                const pkgId = $(this).data('id');
                const pkg = PackageStore.getPackageById(pkgId);
                if (!pkg) return;

                const warrantyNum = pkg.warranty.replace(/[^0-9]/g, '');

                $('#editPackageId').val(pkg.id);
                $('#editPackageName').val(pkg.name);
                $('#editPackageWarranty').val(warrantyNum || '1');

                const editModal = new bootstrap.Modal(document.getElementById('editPackageModal'));
                editModal.show();
            });

            /* =========================
               UPDATE CHANGES
            ========================== */
            $('#editPackageForm').on('submit', function (e) {
                e.preventDefault();

                const pkgId = $('#editPackageId').val();
                const newName = $('#editPackageName').val().trim();
                const newWarranty = $('#editPackageWarranty').val().trim();

                if (!pkgId || !newName || !newWarranty) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Required',
                        text: 'Please fill all required fields.',
                        confirmButtonColor: '#1e4db7'
                    });
                    return;
                }

                PackageStore.updatePackage(pkgId, newName, newWarranty);

                const editModal = bootstrap.Modal.getInstance(document.getElementById('editPackageModal'));
                if (editModal) editModal.hide();

                renderPackagesTable();

                Swal.fire({
                    title: 'Updated!',
                    text: `"${newName}" has been updated successfully.`,
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                });
            });

            /* =========================
               ADD NEW PACKAGE
            ========================== */
            $('#addPackageForm').on('submit', function (e) {
                e.preventDefault();
                const name = $('#newPackageName').val().trim();
                const warranty = $('#newPackageWarranty').val().trim();

                if (!name || !warranty) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Required',
                        text: 'Please fill all required fields.',
                        confirmButtonColor: '#1e4db7'
                    });
                    return;
                }

                PackageStore.addPackage(name, warranty);

                $('#addPackageForm')[0].reset();

                const addModal = bootstrap.Modal.getInstance(document.getElementById('addPackageModal'));
                if (addModal) addModal.hide();

                renderPackagesTable();

                Swal.fire({
                    title: 'Added!',
                    text: `"${name}" has been added successfully.`,
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                });
            });

            /* =========================
               DELETE PACKAGE
            ========================== */
            $(document).on('click', '.btn-delete-pkg', function () {
                const pkgId = $(this).data('id');
                const pkg = PackageStore.getPackageById(pkgId);
                if (!pkg) return;

                Swal.fire({
                    title: 'Are you sure?',
                    text: `Do you want to delete "${pkg.name}"? This action cannot be undone.`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#dc2626',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Yes, delete it!',
                    cancelButtonText: 'Cancel'
                }).then((result) => {
                    if (result.isConfirmed) {
                        PackageStore.deletePackage(pkgId);
                        renderPackagesTable();
                        Swal.fire({
                            title: 'Deleted!',
                            text: `"${pkg.name}" has been removed successfully.`,
                            icon: 'success',
                            timer: 1800,
                            showConfirmButton: false
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
