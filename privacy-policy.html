<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Privacy Policy | Drterrace Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Privacy Policy Management for Dr. Terrace Waterproofing" name="description" />
    <meta content="Drterrace" name="author" />
  <link rel="shortcut icon" href="assets/images/favicon.png">
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">

    <!-- Sweet Alert -->
    <link href="assets/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />

    <!-- Bootstrap Css -->
    <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />

    <!-- Icons Css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />

    <!-- App Css -->
    <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />

    <!-- Responsive & Typography Custom Css -->
    <link href="assets/css/responsive-custom.css" rel="stylesheet" type="text/css" />

    <style>
        .card-custom-editor {
            border-radius: 12px;
            border: 1px solid #eff2f7;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        .mce-tinymce {
            border-radius: 8px !important;
            border-color: #e2e8f0 !important;
            box-shadow: none !important;
            max-width: 100% !important;
        }

        .mce-top-part::before {
            box-shadow: none !important;
        }

        .mce-toolbar-grp {
            padding: 4px !important;
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        .mce-btn-group {
            display: inline-flex !important;
            flex-wrap: wrap !important;
        }

        @media (max-width: 767.98px) {
            .card-body {
                padding: 18px !important;
            }

            .page-title-box {
                align-items: flex-start !important;
                gap: 12px;
            }

            .page-title h4 {
                font-size: 16px;
            }

            .state-information {
                width: 100%;
            }

            .state-information .btn {
                width: 100%;
            }

            .editor-bottom-actions {
                flex-direction: column-reverse !important;
                gap: 10px !important;
            }

            .editor-bottom-actions .btn {
                width: 100% !important;
            }

            #previewModalContent {
                font-size: 13.5px;
                word-break: break-word;
            }
        }
    </style>
</head>

<body data-topbar="colored">

    <!-- Begin page -->
    <div id="layout-wrapper">

        <!-- Header Component -->
        <div id="header"></div>

        <!-- Sidebar Component -->
        <div id="sidebar"></div>

        <!-- ============================================================== -->
        <!-- Start right Content here -->
        <!-- ============================================================== -->
        <div class="main-content">

            <div class="page-content">
                <div class="container-fluid">

                    <!-- Page Title & Breadcrumbs -->
                    <div class="row">
                        <div class="col-12">
                            <div class="page-title-box d-flex align-items-center justify-content-between">
                                <div class="page-title">
                                    <h4 class="mb-0 font-size-18">Privacy Policy</h4>
                                    <ol class="breadcrumb">
                                        <li class="breadcrumb-item">
                                            <a href="index.html">Drterrace</a>
                                        </li>
                                        <li class="breadcrumb-item active">Privacy Policy</li>
                                    </ol>
                                </div>

                                <div class="state-information d-flex gap-2">
                                    <button type="button" class="btn btn-outline-secondary shadow-sm" id="btnPreview">
                                        <i class="mdi mdi-eye-outline me-1 font-size-16 align-middle"></i>
                                        Preview
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Editor Card -->
                    <div class="page-content-wrapper">
                        <div class="row">
                            <div class="col-12">
                                <div class="card card-custom-editor">
                                    <div class="card-body p-4 p-md-5">

                                        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
                                            <div>
                                                <h4 class="card-title mb-1 text-dark">Privacy Policy Editor</h4>
                                            </div>
                                        </div>

                                        <form id="privacyForm" method="post">
                                            <textarea id="elm1" name="privacy_content" rows="18"></textarea>

                                            <div class="d-flex align-items-center justify-content-end gap-2 pt-4 mt-4 border-top editor-bottom-actions">
                                                <button type="button" class="btn btn-outline-secondary px-4" id="btnResetDefault">
                                                    <i class="mdi mdi-trash-can-outline me-1"></i>
                                                    Clear
                                                </button>
                                                <button type="submit" class="btn btn-primary px-4">
                                                    <i class="mdi mdi-content-save-outline me-1"></i>
                                                    Save Changes
                                                </button>
                                            </div>
                                        </form>

                                    </div>
                                    <!-- End Cardbody -->
                                </div>
                                <!-- End Card -->
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Footer Component -->
            <div id="footer"></div>

        </div>
        <!-- end main content-->

    </div>
    <!-- END layout-wrapper -->

    <!-- Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title text-white">
                        <i class="mdi mdi-shield-check-outline me-2"></i> Privacy Policy Preview
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="previewModalContent">
                    <!-- Injected dynamically -->
                </div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-outline-primary px-3" onclick="window.print()">
                        <i class="mdi mdi-printer me-1"></i> Print
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="assets/libs/jquery/jquery.min.js"></script>
    <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/libs/metismenu/metisMenu.min.js"></script>
    <script src="assets/libs/simplebar/simplebar.min.js"></script>
    <script src="assets/libs/node-waves/waves.min.js"></script>
    <script src="assets/libs/sweetalert2/sweetalert2.min.js"></script>

    <!-- Tinymce JS -->
    <script src="assets/libs/tinymce/tinymce.min.js"></script>

    <!-- Component Loader -->
    <script src="assets/js/component-loader.js"></script>

    <!-- App JS -->
    <script src="assets/js/app.js"></script>

    <script>
        $(document).ready(function () {
            const STORAGE_KEY = 'drterrace_privacy_policy_content_v1';
            const savedContent = localStorage.getItem(STORAGE_KEY) || '';

            $('#elm1').val(savedContent);

            // Initialize TinyMCE Editor
            tinymce.init({
                selector: "textarea#elm1",
                height: 480,
                plugins: [
                    "advlist autolink link image lists charmap print preview hr anchor pagebreak spellchecker",
                    "searchreplace wordcount visualblocks visualchars code fullscreen insertdatetime media nonbreaking",
                    "save table contextmenu directionality emoticons template paste textcolor"
                ],
                toolbar: "insertfile undo redo | styleselect | bold italic underline | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image | print preview media | forecolor backcolor emoticons",
                style_formats: [
                    { title: "Bold text", inline: "b" },
                    { title: "Red text", inline: "span", styles: { color: "#ff0000" } },
                    { title: "Red header", block: "h1", styles: { color: "#ff0000" } },
                    { title: "Example 1", inline: "span", classes: "example1" },
                    { title: "Example 2", inline: "span", classes: "example2" },
                    { title: "Table styles" },
                    { title: "Table row 1", selector: "tr", classes: "tablerow1" }
                ],
                setup: function (editor) {
                    editor.on('init', function () {
                        if (savedContent) {
                            editor.setContent(savedContent);
                        }
                    });
                }
            });

            function savePrivacyContent() {
                const editor = tinymce.get('elm1');
                const content = editor ? editor.getContent() : $('#elm1').val();

                localStorage.setItem(STORAGE_KEY, content);

                Swal.fire({
                    icon: 'success',
                    title: 'Saved Successfully!',
                    text: 'Privacy Policy content has been saved.',
                    timer: 1800,
                    showConfirmButton: false
                });
            }

            // Form Submit
            $('#privacyForm').on('submit', function (e) {
                e.preventDefault();
                savePrivacyContent();
            });

            // Top Save Button
            $('#topSaveBtn').on('click', function () {
                savePrivacyContent();
            });

            // Clear Content
            $('#btnResetDefault').on('click', function () {
                Swal.fire({
                    title: 'Clear Editor?',
                    text: 'Are you sure you want to clear the Privacy Policy content?',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#dc2626',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Yes, clear it!',
                    cancelButtonText: 'Cancel'
                }).then((result) => {
                    if (result.isConfirmed) {
                        const editor = tinymce.get('elm1');
                        if (editor) {
                            editor.setContent('');
                        }
                        localStorage.removeItem(STORAGE_KEY);
                        Swal.fire({
                            icon: 'success',
                            title: 'Cleared',
                            text: 'Privacy Policy editor has been cleared.',
                            timer: 1500,
                            showConfirmButton: false
                        });
                    }
                });
            });

            // Preview Modal
            $('#btnPreview').on('click', function () {
                const editor = tinymce.get('elm1');
                const content = editor ? editor.getContent() : $('#elm1').val();
                $('#previewModalContent').html(content || '<p class="text-muted text-center py-4">No content entered yet.</p>');
                const previewModal = new bootstrap.Modal(document.getElementById('previewModal'));
                previewModal.show();
            });

        });
    </script>

</body>

</html>
