    <style>

        :root {
            --dr-primary: #1e4db7;
            --dr-primary-hover: #163d94;
            --dr-input-border: #dbe2ea;
            --dr-text-main: #1e293b;
            --dr-text-muted: #64748b;
        }

        /* =========================
           GENERAL FORM STYLES
        ========================= */

        .required-star {
            color: #ef4444;
            
            margin-left: 2px;
        }

        .form-label-custom {
            
            color: var(--dr-text-main);
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            align-items: center;
        }

        .form-control-custom {
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 15px;
            border: 1.5px solid var(--dr-input-border);
            color: #334155;
            background-color: #ffffff;
            transition: all 0.2s ease-in-out;
            min-height: 48px;
        }

        .form-control-custom::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .form-control-custom:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background-color: #ffffff;
        }

        /* =========================
           SECTION TITLE
        ========================= */

        .section-header-title {
            font-size: 16px;
            
            color: var(--dr-text-main);
            margin-bottom: 14px;
        }

        /* =========================
           GOOGLE LOCATION ICON
        ========================= */

        .input-icon-wrapper {
            position: relative;
            width: 100%;
        }

        .input-icon-wrapper .form-control-custom {
            width: 100%;
            padding-right: 50px;
        }

        .input-trailing-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dr-primary);
            font-size: 20px;
            pointer-events: none;
        }

        /* =========================
           DATE & TIME
           Native icons only
        ========================= */

        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding-right: 16px;
        }

        /* =========================
           SEARCHABLE CITY / AREA
        ========================= */

        .search-select-wrapper {
            position: relative;
            width: 100%;
        }

        .search-select-wrapper .form-control-custom {
            padding-right: 45px;
        }

        .search-select-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 22px;
            pointer-events: none;
        }

        .search-suggestions {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1.5px solid var(--dr-input-border);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
            max-height: 220px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
        }

        .search-suggestion-item {
            padding: 11px 16px;
            cursor: pointer;
            font-size: 15px;
            color: #334155;
            transition: background 0.2s ease;
        }

        .search-suggestion-item:hover {
            background: #f1f5f9;
            color: var(--dr-primary);
        }

        /* =========================
           WATERPROOF CHECKBOXES
        ========================= */

        .waterproof-options-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .custom-check-item {
            display: flex;
            align-items: center;
            position: relative;
            cursor: pointer;
            user-select: none;
            margin-bottom: 0;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            border: 1.5px solid var(--dr-input-border);
            border-radius: 10px;
            padding: 10px 12px;
            transition: all 0.2s ease;
            background-color: #ffffff;
        }

        .custom-check-item:hover {
            border-color: var(--dr-primary);
        }

        .custom-check-item.is-checked {
            border-color: var(--dr-primary);
            background-color: rgba(30, 77, 183, 0.04);
        }

        .custom-check-item input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            height: 0;
            width: 0;
        }

        .custom-checkmark {
            height: 18px;
            width: 18px;
            background-color: #ffffff;
            border: 2px solid #94a3b8;
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .custom-check-item input:checked ~ .custom-checkmark {
            background-color: var(--dr-primary);
            border-color: var(--dr-primary);
        }

        .custom-checkmark::after {
            content: "";
            display: none;
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }

        .custom-check-item input:checked ~ .custom-checkmark::after {
            display: block;
        }

        /* =========================
           ASSIGN TO
        ========================= */

        .form-select-custom {
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 15px;
            border: 1.5px solid var(--dr-input-border);
            color: #334155;
            background-color: #ffffff;
            min-height: 48px;
        }

        .form-select-custom:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* =========================
           DROPDOWN CHECKLIST
        ========================= */

        .custom-dropdown-checklist .dropdown-menu {
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1) !important;
            border: 1px solid #e2e8f0 !important;
            z-index: 1050;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
            user-select: none;
            margin-bottom: 0;
            font-size: 14px;
            color: #334155;
        }

        .checklist-item:hover {
            background-color: #f1f5f9;
        }

        .checklist-item input[type="checkbox"] {
            width: 17px;
            height: 17px;
            border-radius: 4px;
            border: 1.5px solid #94a3b8;
            margin-right: 10px;
            cursor: pointer;
            accent-color: var(--dr-primary);
        }

        .checklist-item span {
            flex-grow: 1;
        }

        /* =========================
           BUTTONS
        ========================= */

        .btn-submit-appointment {
            background-color: var(--dr-primary);
            border-color: var(--dr-primary);
            color: #ffffff;
            
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .btn-submit-appointment:hover {
            background-color: var(--dr-primary-hover);
            border-color: var(--dr-primary-hover);
            color: #ffffff;
        }

        .btn-cancel-appointment {
            background-color: #ffffff;
            border: 1.5px solid var(--dr-input-border);
            color: #475569;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
        }

        .btn-cancel-appointment:hover {
            background-color: #f1f5f9;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 767.98px) {

            .waterproof-options-list {
                grid-template-columns: repeat(2, 1fr);
            }

            .btn-submit-appointment,
            .btn-cancel-appointment {
                width: 100%;
            }

        }

        @media (max-width: 420px) {

            .waterproof-options-list {
                grid-template-columns: 1fr;
            }

        }

    </style>

                ]

            };


            const cityInput =
                document.getElementById("cityInput");

            const areaInput =
                document.getElementById("areaInput");

            const citySuggestions =
                document.getElementById("citySuggestions");

            const areaSuggestions =
                document.getElementById("areaSuggestions");

            const cities = Object.keys(cityAreas);


            /* ==========================================
               HELPERS - case & whitespace safe matching
            ========================================== */

            function normalize(text) {
                return (text || "").toString().trim().toLowerCase();
            }


            /* ==========================================
               CITY SUGGESTIONS
            ========================================== */

            function showCitySuggestions(searchText = "") {

                citySuggestions.innerHTML = "";

                const query = normalize(searchText);

                const filteredCities = cities.filter(function (city) {

                    return normalize(city).includes(query);

                });


                filteredCities.forEach(function (city) {

                    const item =
                        document.createElement("div");

                    item.className =
                        "search-suggestion-item";

                    item.textContent = city;


                    item.addEventListener("click", function () {

                        cityInput.value = city;

                        areaInput.value = "";

                        citySuggestions.style.display = "none";

                        areaInput.focus();

                        showAreaSuggestions("");

                    });


                    citySuggestions.appendChild(item);

                });


                if (filteredCities.length > 0) {

                    citySuggestions.style.display = "block";

                } else {

                    citySuggestions.style.display = "none";

                }

            }


            /* ==========================================
               AREA SUGGESTIONS
            ========================================== */

            function showAreaSuggestions(searchText = "") {

                areaSuggestions.innerHTML = "";

                const selectedCity =
                    normalize(cityInput.value);


                const matchedCity =
                    cities.find(function (city) {

                        return normalize(city) === selectedCity;

                    });


                /* If custom city is typed,
                   user can still manually type area */

                if (!matchedCity) {

                    areaSuggestions.style.display = "none";

                    return;

                }


                const areas =
                    cityAreas[matchedCity];


                const query = normalize(searchText);

                const filteredAreas =
                    areas.filter(function (area) {

                        return normalize(area).includes(query);

                    });


                filteredAreas.forEach(function (area) {

                    const item =
                        document.createElement("div");

                    item.className =
                        "search-suggestion-item";

                    item.textContent = area;


                    item.addEventListener("click", function () {

                        areaInput.value = area;

                        areaSuggestions.style.display = "none";

                    });


                    areaSuggestions.appendChild(item);

                });


                if (filteredAreas.length > 0) {

                    areaSuggestions.style.display = "block";

                } else {

                    areaSuggestions.style.display = "none";

                }

            }


            /* ==========================================
               CITY EVENTS
               (click AND focus both open the list so it
               reliably reopens even if the field already
               has focus; typing keeps filtering live)
            ========================================== */

            cityInput.addEventListener("focus", function () {

                showCitySuggestions(this.value);

            });

            cityInput.addEventListener("click", function (e) {

                e.stopPropagation();

                showCitySuggestions(this.value);

            });


            cityInput.addEventListener("input", function () {

                const typedCity =
                    this.value;

                showCitySuggestions(typedCity);

                areaInput.value = "";

            });


            /* ==========================================
               AREA EVENTS
            ========================================== */

            areaInput.addEventListener("focus", function () {

                showAreaSuggestions(this.value);

            });

            areaInput.addEventListener("click", function (e) {

                e.stopPropagation();

                showAreaSuggestions(this.value);

            });


            areaInput.addEventListener("input", function () {

                const typedArea =
                    this.value;

                showAreaSuggestions(typedArea);

            });


            /* ==========================================
               CLOSE CITY / AREA DROPDOWN
            ========================================== */

            document.addEventListener("click", function (event) {

                if (!event.target.closest("#cityWrapper")) {

                    citySuggestions.style.display = "none";

                }


                if (!event.target.closest("#areaWrapper")) {

                    areaSuggestions.style.display = "none";

                }

            });


            /* ==========================================
               MOBILE NUMBER
            ========================================== */

            $("#customerMobile").on("input", function () {

                let value =
                    $(this)
                        .val()
                        .replace(/\D/g, "");

                if (value.length > 10) {

                    value =
                        value.substring(0, 10);

                }

                $(this).val(value);

            });


            /* ==========================================
               LOAD DYNAMIC DROPDOWNS FROM LOCALSTORAGE
            ========================================== */

            function updateWaterproofSelectedDisplay() {
                const selected = [];
                $('.waterproof-checkbox:checked').each(function() {
                    selected.push($(this).val());
                });

                if (selected.length === 0) {
                    $('#waterproofSelectedText').text('Choose waterproof types').removeClass('text-dark').addClass('text-muted');
                } else if (selected.length === 1) {
                    $('#waterproofSelectedText').text(selected[0]).removeClass('text-muted').addClass('text-dark');
                } else if (selected.length === 2) {
                    $('#waterproofSelectedText').text(selected.join(', ')).removeClass('text-muted').addClass('text-dark');
                } else {
                    $('#waterproofSelectedText').text(`${selected.length} Types Selected (${selected.slice(0, 2).join(', ')}...)`).removeClass('text-muted').addClass('text-dark');
                }
            }

            function loadWaterproofTypesDropdown() {
                const defaultWaterproofTypes = [
                    "Outer Wall Proofing",
                    "Terrace Waterproofing",
                    "Bathroom Waterproofing",
                    "Sump Waterproofing",
                    "Basement Waterproofing"
                ];
                let types = defaultWaterproofTypes;
                const stored = localStorage.getItem('drterrace_waterproof_types');
                if (stored) {
                    try {
                        types = JSON.parse(stored);
                    } catch (e) {
                        types = defaultWaterproofTypes;
                    }
                }
                const $container = $('#waterproofChecklistOptions');
                $container.empty();
                types.forEach(function (type, idx) {
                    const id = `wt_opt_${idx}`;
                    $container.append(`
                        <label class="checklist-item" for="${id}">
                            <input type="checkbox" id="${id}" name="waterproof_services" value="${type}" class="waterproof-checkbox">
                            <span>${type}</span>
                        </label>
                    `);
                });
                updateWaterproofSelectedDisplay();
            }

            $(document).on('change', '.waterproof-checkbox', function () {
                updateWaterproofSelectedDisplay();
            });

            $('#selectAllWaterproof').on('click', function () {
                const $allCheckboxes = $('.waterproof-checkbox');
                const allChecked = $allCheckboxes.length > 0 && $allCheckboxes.filter(':checked').length === $allCheckboxes.length;
                $allCheckboxes.prop('checked', !allChecked);
                $(this).text(allChecked ? 'Select All' : 'Deselect All');
                updateWaterproofSelectedDisplay();
            });

            function loadHouseTypesDropdown() {
                const defaultHouseTypes = [
                    "Independent Villa",
                    "Apartment / Flat",
                    "Commercial Building",
                    "Independent House",
                    "Row House / Duplex",
                    "Industrial Shed / Factory"
                ];
                let types = defaultHouseTypes;
                const stored = localStorage.getItem('drterrace_house_types');
                if (stored) {
                    try {
                        types = JSON.parse(stored);
                    } catch (e) {
                        types = defaultHouseTypes;
                    }
                }
                const $select = $('#propertyStructureType');
                $select.empty().append('<option value="" disabled selected>Choose property type</option>');
                types.forEach(function (type) {
                    $select.append(`<option value="${type}">${type}</option>`);
                });
            }

            loadWaterproofTypesDropdown();
            loadHouseTypesDropdown();


            /* ==========================================
               FORM SUBMIT (ALL FIELDS REQUIRED)
            ========================================== */

            $("#newAppointmentForm").on(
                "submit",
                function (e) {

                    e.preventDefault();

                    const customerId = $("#customerId").val().trim();
                    const customerName = $("#customerName").val().trim();
                    const mobile = $("#customerMobile").val().trim();
                    const doorFlatNo = $("#doorFlatNo").val().trim();
                    const streetRoad = $("#streetRoad").val().trim();
                    const pincode = $("#pincode").val().trim();
                    const city = $("#cityInput").val().trim();
                    const area = $("#areaInput").val().trim();
                    const googleLocation = $("#googleLocation").val().trim();
                    const appointmentDate = $("#appointmentDate").val().trim();
                    const appointmentFixDate = $("#appointmentFixDate").val().trim();
                    const appointmentTime = $("#appointmentTime").val().trim();
                    const propertyType = $("#propertyStructureType").val();
                    const estimatedArea = $("#estimatedArea").val().trim();
                    const assigned = $("#assignedTo").val();

                    const selectedWaterproof = [];
                    $('.waterproof-checkbox:checked').each(function () {
                        selectedWaterproof.push($(this).val());
                    });

                    // Field Validations
                    if (!customerId) {
                        Swal.fire({ icon: "warning", title: "Customer ID Required", text: "Please enter a Customer ID.", confirmButtonColor: "#1e4db7" });
                        $("#customerId").focus();
                        return;
                    }

                    if (!customerName) {
                        Swal.fire({ icon: "warning", title: "Customer Name Required", text: "Please enter Customer Name.", confirmButtonColor: "#1e4db7" });
                        $("#customerName").focus();
                        return;
                    }

                    if (!mobile || mobile.length !== 10 || !/^[6-9]\d{9}$/.test(mobile)) {
                        Swal.fire({ icon: "warning", title: "Invalid Mobile Number", text: "Please enter a valid 10-digit Indian mobile number (starts with 6-9).", confirmButtonColor: "#1e4db7" });
                        $("#customerMobile").focus();
                        return;
                    }

                    if (!doorFlatNo) {
                        Swal.fire({ icon: "warning", title: "Door / Flat No Required", text: "Please enter Door No / Flat No.", confirmButtonColor: "#1e4db7" });
                        $("#doorFlatNo").focus();
                        return;
                    }

                    if (!streetRoad) {
                        Swal.fire({ icon: "warning", title: "Street Name / Road Required", text: "Please enter Street Name / Road.", confirmButtonColor: "#1e4db7" });
                        $("#streetRoad").focus();
                        return;
                    }

                    if (!pincode || !/^\d{6}$/.test(pincode)) {
                        Swal.fire({ icon: "warning", title: "Invalid Pincode", text: "Please enter a valid 6-digit postal pincode.", confirmButtonColor: "#1e4db7" });
                        $("#pincode").focus();
                        return;
                    }

                    if (!city) {
                        Swal.fire({ icon: "warning", title: "City Required", text: "Please select or enter a City.", confirmButtonColor: "#1e4db7" });
                        $("#cityInput").focus();
                        return;
                    }

                    if (!area) {
                        Swal.fire({ icon: "warning", title: "Area Required", text: "Please select or enter an Area.", confirmButtonColor: "#1e4db7" });
                        $("#areaInput").focus();
                        return;
                    }

                    if (!googleLocation) {
                        Swal.fire({ icon: "warning", title: "Google Location Required", text: "Please paste the Google Location URL.", confirmButtonColor: "#1e4db7" });
                        $("#googleLocation").focus();
                        return;
                    }

                    if (!appointmentDate) {
                        Swal.fire({ icon: "warning", title: "Appointment Date Required", text: "Please select an Appointment Date.", confirmButtonColor: "#1e4db7" });
                        $("#appointmentDate").focus();
                        return;
                    }

                    if (!appointmentFixDate) {
                        Swal.fire({ icon: "warning", title: "Appointment Fix Date Required", text: "Please select an Appointment Fix Date.", confirmButtonColor: "#1e4db7" });
                        $("#appointmentFixDate").focus();
                        return;
                    }

                    if (!appointmentTime) {
                        Swal.fire({ icon: "warning", title: "Appointment Time Required", text: "Please select Appointment Time.", confirmButtonColor: "#1e4db7" });
                        $("#appointmentTime").focus();
                        return;
                    }

                    if (selectedWaterproof.length === 0) {
                        Swal.fire({
                            icon: "warning",
                            title: "Select Waterproof Type",
                            text: "Please choose at least one option under 'Where to Waterproof'.",
                            confirmButtonColor: "#1e4db7"
                        });
                        $("#whereToWaterproofBtn").focus();
                        return;
                    }

                    if (!propertyType) {
                        Swal.fire({ icon: "warning", title: "Property Type Required", text: "Please select Property Type / Structure Type.", confirmButtonColor: "#1e4db7" });
                        $("#propertyStructureType").focus();
                        return;
                    }

                    if (!estimatedArea) {
                        Swal.fire({ icon: "warning", title: "Estimated Area Required", text: "Please enter the Estimated Area (e.g. 1,500 Sq. Ft.).", confirmButtonColor: "#1e4db7" });
                        $("#estimatedArea").focus();
                        return;
                    }

                    if (!assigned) {
                        Swal.fire({ icon: "warning", title: "Assign to Required", text: "Please choose a field executive.", confirmButtonColor: "#1e4db7" });
                        $("#assignedTo").focus();
                        return;
                    }

                    const waterproofText = selectedWaterproof.join(', ');

                    Swal.fire({
                        icon: "success",
                        title: "Appointment Booked Successfully!",
                        html:
                            "Appointment for <b>" +
                            customerName + " (" + customerId + ")" +
                            "</b> has been scheduled for <b>" +
                            appointmentDate +
                            " at " +
                            appointmentTime +
                            "</b><br><small class='text-muted'>Where to Waterproof: <b>" +
                            waterproofText +
                            "</b><br>Property Type: <b>" + propertyType + "</b>" +
                            "<br>Estimated Area: <b>" + estimatedArea + "</b>" +
                            "<br>Assigned to: <b>" +
                            assigned +
                            "</b></small>",
                        confirmButtonColor: "#1e4db7",
                        confirmButtonText:
                            "Go to Dashboard",
                        showCancelButton: true,
                        cancelButtonText:
                            "Book Another"
                    }).then(function (result) {
                        if (result.isConfirmed) {
                            window.location.href =
                                "index.html";
                        } else {
                            $("#newAppointmentForm")[0].reset();
                            loadWaterproofTypesDropdown();
                            loadHouseTypesDropdown();
                        }
                    });
                }
            );


            /* ==========================================
               CANCEL BUTTON
            ========================================== */

            $(".btn-cancel-appointment").on(
                "click",
                function () {
                    $("#newAppointmentForm")[0].reset();
                    cityInput.value = "";
                    areaInput.value = "";
                    loadWaterproofTypesDropdown();
                    loadHouseTypesDropdown();
                }
            );

        });

    </script>

</body>

</html>
