    <script>

        $(document).ready(function () {


            /* =========================
               INITIALIZE DATATABLE
            ========================== */

            const dataTable = $('#datatable-waterproof-types').DataTable({

                pageLength: 10,

                order: [],

                columnDefs: [
                    {
                        orderable: false,
                        targets: 2
                    }
                ],

                language: {

                    paginate: {

                        previous: "<i class='mdi mdi-chevron-left'></i>",

                        next: "<i class='mdi mdi-chevron-right'></i>"

                    }

                }

            });


            /* =========================
               REFRESH SERIAL NUMBERS
            ========================== */

            function refreshSerialNumbers() {

                dataTable.rows({
                    search: 'applied',
                    order: 'applied'
                }).every(function (rowIndex) {

                    const row = this.node();

                    $(row)
                        .find('.sl-no-col')
                        .text(rowIndex + 1);

                });

            }


            /* =========================
               EDIT
            ========================== */

            let currentRowToEdit = null;


            $(document).on('click', '.btn-edit-wt', function () {

                currentRowToEdit = $(this).closest('tr');

                const currentName = currentRowToEdit
                    .find('.wt-name')
                    .text()
                    .trim();


                $('#editTypeName').val(currentName);


                const editModal = new bootstrap.Modal(
                    document.getElementById('editWaterproofModal')
                );

                editModal.show();

            });


            /* =========================
               UPDATE CHANGES
            ========================== */

            $('#editWaterproofForm').on('submit', function (e) {

                e.preventDefault();


                if (!currentRowToEdit) {
                    return;
                }


                const newName = $('#editTypeName')
                    .val()
                    .trim();


                if (newName === '') {

                    Swal.fire({
                        icon: 'warning',
                        title: 'Required',
                        text: 'Please enter a waterproof type name.',
                        confirmButtonColor: '#1e4db7'
                    });

                    return;
                }


                /* Check duplicate */

                let isDuplicate = false;

                dataTable.rows().every(function () {

                    const row = $(this.node());

                    if (
                        row[0] !== currentRowToEdit[0] &&
                        row.find('.wt-name')
                            .text()
                            .trim()
                            .toLowerCase() === newName.toLowerCase()
                    ) {
                        isDuplicate = true;
                    }

                });


                if (isDuplicate) {

                    Swal.fire({
                        icon: 'warning',
                        title: 'Already Exists',
                        text: 'This waterproof type already exists.',
                        confirmButtonColor: '#1e4db7'
                    });

                    return;
                }


                /* Update table */

                currentRowToEdit
                    .find('.wt-name')
                    .text(newName);


                /* Update DataTable */

                dataTable
                    .row(currentRowToEdit)
                    .invalidate()
                    .draw(false);


                /* Close modal */

                const editModal =
                    bootstrap.Modal.getInstance(
                        document.getElementById('editWaterproofModal')
                    );

                editModal.hide();


                /* Success message */

                Swal.fire({
                    title: 'Updated!',
                    text: `"${newName}" has been updated successfully.`,
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                });

            });


            /* =========================
               ADD NEW TYPE
            ========================== */

            $('#addWaterproofForm').on('submit', function (e) {

                e.preventDefault();


                const name = $('#newTypeName')
                    .val()
                    .trim();


                if (name === '') {

                    Swal.fire({
                        icon: 'warning',
                        title: 'Required',
                        text: 'Please enter a waterproof type name.',
                        confirmButtonColor: '#1e4db7'
                    });

                    return;
                }


                /* Check duplicate */

                let isDuplicate = false;


                dataTable.rows().every(function () {

                    const existingName = $(this.node())
                        .find('.wt-name')
                        .text()
                        .trim()
                        .toLowerCase();


                    if (existingName === name.toLowerCase()) {
                        isDuplicate = true;
                    }

                });


                if (isDuplicate) {

                    Swal.fire({
                        icon: 'warning',
                        title: 'Already Exists',
                        text: 'This waterproof type already exists.',
                        confirmButtonColor: '#1e4db7'
                    });

                    return;
                }


                /* Create new row */

                const newRow = dataTable.row.add([

                    '',

                    `<h6 class="font-size-15 mb-0 text-dark wt-name">
                        ${name}
                    </h6>`,

                    `
                    <div class="btn-group btn-group-sm">

                        <button type="button"
                            class="btn btn-soft-primary btn-edit-wt me-1"
                            title="Edit">

                            <i class="mdi mdi-pencil font-size-15"></i>

                        </button>

                        <button type="button"
                            class="btn btn-soft-danger btn-delete-wt"
                            title="Delete">

                            <i class="mdi mdi-trash-can-outline font-size-15"></i>

                        </button>

                    </div>
                    `

                ]).draw(false);


                /* Refresh serial numbers */

                refreshSerialNumbers();


                /* Reset form */

                $('#addWaterproofForm')[0].reset();


                /* Close modal */

                const addModal =
                    bootstrap.Modal.getInstance(
                        document.getElementById('addWaterproofModal')
                    );

                addModal.hide();


                /* Success */

                Swal.fire({
                    title: 'Added!',
                    text: `"${name}" has been added successfully.`,
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                });

            });


            /* =========================
               DELETE
            ========================== */

            $(document).on('click', '.btn-delete-wt', function () {

                const button = $(this);

                const row = button.closest('tr');

                const typeName = row
                    .find('.wt-name')
                    .text()
                    .trim();


                Swal.fire({

                    title: 'Are you sure?',

                    text: `Do you want to delete "${typeName}"? This action cannot be undone.`,

                    icon: 'warning',

                    showCancelButton: true,

                    confirmButtonColor: '#dc2626',

                    cancelButtonColor: '#64748b',

                    confirmButtonText: 'Yes, delete it!',

                    cancelButtonText: 'Cancel'

                }).then((result) => {


                    if (result.isConfirmed) {


                        dataTable
                            .row(row)
                            .remove()
                            .draw(false);


                        refreshSerialNumbers();


                        Swal.fire({

                            title: 'Deleted!',

                            text: `"${typeName}" has been removed successfully.`,

                            icon: 'success',

                            timer: 1800,

                            showConfirmButton: false

                        });

                    }

                });

            });


            /* =========================
               REFRESH SERIAL ON DRAW
            ========================== */

            dataTable.on('draw', function () {

                refreshSerialNumbers();

            });


        });

    </script>
