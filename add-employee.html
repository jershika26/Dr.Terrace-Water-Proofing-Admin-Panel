<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Employee Add | Drterrace Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Drterrace Employee Management System" name="description" />
    <meta content="Themesbrand" name="author" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">

    <!-- Plugin Css -->
    <link href="assets/libs/select2/css/select2.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />

    <!-- Bootstrap Css -->
    <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />
    <!-- Responsive & Typography Custom Css -->
    <link href="assets/css/responsive-custom.css" rel="stylesheet" type="text/css" />

    <style>
        .required-star {
            color: #f46a6a;
            font-weight: bold;
            margin-left: 2px;
        }

        .form-label {
            font-weight: 600;
            color: #212529;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #ced4da;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus, .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .salary-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .salary-card-header {
            font-weight: 700;
            font-size: 16px;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .image-upload-wrapper {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            margin-top: 8px;
        }

        .upload-circle-btn {
            width: 70px;
            height: 70px;
            border: 1px solid #ced4da;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #6c757d;
            background-color: #f8f9fa;
            text-align: center;
            padding: 4px;
        }

        .upload-circle-btn:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .upload-circle-btn i {
            font-size: 20px;
            line-height: 1;
        }

        .upload-circle-btn span {
            font-size: 10px;
            margin-top: 2px;
        }

        .avatar-preview-container {
            position: relative;
            width: 70px;
            height: 70px;
        }

        .avatar-preview-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ced4da;
        }

        .avatar-badge-check {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background-color: #0284c7;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid #ffffff;
        }

        @media (max-width: 575.98px) {
            .image-upload-wrapper {
                justify-content: flex-start;
            }
        }

        .btn-save-custom {
            background-color: #009ef7;
            border-color: #009ef7;
            color: #ffffff;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 28px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 158, 247, 0.25);
        }

        .btn-save-custom:hover {
            background-color: #0086d4;
            border-color: #0086d4;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(0, 158, 247, 0.35);
            transform: translateY(-1px);
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0;
            font-size: 18px;
        }

        .password-toggle-btn:hover {
            color: #0f172a;
        }
    </style>
</head>

<body><h1> This page is not updated</h1></body>

</html>
