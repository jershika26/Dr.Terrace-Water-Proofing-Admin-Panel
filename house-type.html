    <!-- JAVASCRIPT -->

    <script src="assets/libs/datatables.net/js/jquery.dataTables.min.js"></script>

    <!-- Responsive examples -->
    <script src="assets/libs/datatables.net-responsive/js/dataTables.responsive.min.js"></script>
    <script src="assets/libs/datatables.net-responsive-bs4/js/responsive.bootstrap4.min.js"></script>

    <!-- Component Loader -->
    <script src="assets/js/component-loader.js"></script>

    <!-- App JS -->
    <script src="assets/js/app.js"></script>

    <script>
        $(document).ready(function () {

            const STORAGE_KEY = 'drterrace_house_types';
            const defaultHouseTypes = [
                "Independent Villa",
                "Apartment / Flat",
                "Commercial Building",
                "Independent House",
                "Row House / Duplex",
                "Industrial Shed / Factory"
            ];

            function getStoredTypes() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        return JSON.parse(stored);
                    } catch (e) {
                        return defaultHouseTypes;
                    }
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultHouseTypes));
                return defaultHouseTypes;
            }

            function saveStoredTypes() {
                const types = [];
                dataTable.rows().every(function () {
                    const name = $(this.node()).find('.ht-name').text().trim() || $(this.node()).find('td').eq(1).text().trim();
                    if (name) {
                        types.push(name);
                    }
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(types));
            }

            /* =========================
               INITIALIZE DATATABLE
            ========================== */
            const dataTable = $('#datatable-house-types').DataTable({
                paging: false,
                searching: false,
                info: false,
                lengthChange: false,
                autoWidth: false,
                responsive: false,
                order: [],
                columnDefs: [
                    {
                        orderable: false,
                        targets: [0, 2]
                    },
                    {
                        className: 'text-center',
                        targets: [0, 2]
                    }
                ]
            });

            /* Load from localStorage */
            const initialTypes = getStoredTypes();
            dataTable.clear();
            initialTypes.forEach(function (typeName) {
                dataTable.row.add([
                    `<span class="sl-no-col"></span>`,
                    `<span class="ht-name">${typeName}</span>`,
                    `<div class="text-center">
                        <button type="button" class="btn btn-outline-secondary btn-sm btn-edit-ht" title="Edit">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm btn-delete-ht" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>`
                ]);
            });
            dataTable.draw(false);

            /* =========================
               REFRESH SERIAL NUMBERS
            ========================== */
            function refreshSerialNumbers() {
                dataTable.rows({
                    search: 'applied',
                    order: 'applied'
                }).every(function (rowIndex) {
                    const row = this.node();
                    $(row).find('td').eq(0).addClass('sl-no-col').text(rowIndex + 1);
                });
            }

            refreshSerialNumbers();

            /* =========================
               EDIT
            ========================== */
            let currentRowToEdit = null;

            $(document).on('click', '.btn-edit-ht', function () {
                currentRowToEdit = $(this).closest('tr');
                const currentName = currentRowToEdit.find('.ht-name').text().trim() || currentRowToEdit.find('td').eq(1).text().trim();

                $('#editTypeName').val(currentName);

                const editModal = new bootstrap.Modal(
                    document.getElementById('editHouseTypeModal')
                );
                editModal.show();
            });

            /* =========================
               UPDATE CHANGES
            ========================== */
            $('#editHouseTypeForm').on('submit', function (e) {
                e.preventDefault();

                if (!currentRowToEdit) {
                    return;
                }

                const newName = $('#editTypeName').val().trim();

                if (newName === '') {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Required',
                        text: 'Please enter a Property type name.',
                        confirmButtonColor: '#1e4db7'
                    });
                    return;
                }

                /* Check duplicate */
                let isDuplicate = false;
                dataTable.rows().every(function () {
                    const row = $(this.node());
                    const rowName = row.find('.ht-name').text().trim() || row.find('td').eq(1).text().trim();
                    if (
                        row[0] !== currentRowToEdit[0] &&
                        rowName.toLowerCase() === newName.toLowerCase()
                    ) {
                        isDuplicate = true;
                    }
                });

                if (isDuplicate) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Already Exists',
                        text: 'This house type already exists.',
                        confirmButtonColor: '#1e4db7'
                    });
                    return;
                }

                /* Update table */
                if (currentRowToEdit.find('.ht-name').length) {
                    currentRowToEdit.find('.ht-name').text(newName);
                } else {
                    currentRowToEdit.find('td').eq(1).html(`<span class="ht-name">${newName}</span>`);
                }

                /* Update DataTable */
                dataTable
                    .row(currentRowToEdit)
                    .invalidate()
                    .draw(false);

                saveStoredTypes();

                /* Close modal */
                const editModal = bootstrap.Modal.getInstance(
                    document.getElementById('editHouseTypeModal')
                );
                editModal.hide();

                /* Success message */
                Swal.fire({
                    title: 'Updated!',
                    text: `"${newName}" has been updated successfully.`,
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                });
            });

            /* =========================
               ADD NEW TYPE
            ========================== */
            $('#addHouseTypeForm').on('submit', function (e) {
                e.preventDefault();

                const name = $('#newTypeName').val().trim();

                if (name === '') {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Required',
                        text: 'Please enter a Property type name.',
                        confirmButtonColor: '#1e4db7'
                    });
                    return;
                }

                /* Check duplicate */
                let isDuplicate = false;
                dataTable.rows().every(function () {
                    const existingName = $(this.node()).find('.ht-name').text().trim() || $(this.node()).find('td').eq(1).text().trim();
                    if (existingName.toLowerCase() === name.toLowerCase()) {
                        isDuplicate = true;
                    }
                });

                if (isDuplicate) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Already Exists',
                        text: 'This house type already exists.',
                        confirmButtonColor: '#1e4db7'
                    });
                    return;
                }

                /* Create new row with matching styling */
                dataTable.row.add([
                    `<span class="sl-no-col"></span>`,
                    `<span class="ht-name">${name}</span>`,
                    `<div class="text-center">
                        <button type="button" class="btn btn-outline-secondary btn-sm btn-edit-ht" title="Edit">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm btn-delete-ht" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>`
                ]).draw(false);

                /* Refresh serial numbers */
                refreshSerialNumbers();

                saveStoredTypes();

                /* Reset form */
                $('#addHouseTypeForm')[0].reset();

                /* Close modal */
                const addModal = bootstrap.Modal.getInstance(
                    document.getElementById('addHouseTypeModal')
                );
                addModal.hide();

                /* Success */
                Swal.fire({
                    title: 'Added!',
                    text: `"${name}" has been added successfully.`,
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                });
            });

            /* =========================
               DELETE
            ========================== */
            $(document).on('click', '.btn-delete-ht', function () {
                const button = $(this);
                const row = button.closest('tr');
                const typeName = row.find('.ht-name').text().trim() || row.find('td').eq(1).text().trim();

                Swal.fire({
                    title: 'Are you sure?',
                    text: `Do you want to delete "${typeName}"? This action cannot be undone.`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#dc2626',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Yes, delete it!',
                    cancelButtonText: 'Cancel'
                }).then((result) => {
                    if (result.isConfirmed) {
                        dataTable
                            .row(row)
                            .remove()
                            .draw(false);

                        refreshSerialNumbers();
                        saveStoredTypes();

                        Swal.fire({
                            title: 'Deleted!',
                            text: `"${typeName}" has been removed successfully.`,
                            icon: 'success',
                            timer: 1800,
                            showConfirmButton: false
                        });
                    }
                });
            });

            /* =========================
               REFRESH SERIAL ON DRAW
            ========================== */
            dataTable.on('draw', function () {
                refreshSerialNumbers();
            });

        });
    </script>
